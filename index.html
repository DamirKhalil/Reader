<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр творческого акта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=IBM+Plex+Mono&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap">
<style>
/* Концепция: «из ничего». Бумага и чернила, много пустоты, цвет появляется
   только там, где вы уже поработали. Колонка текста слева, тихая навигация сбоку. */
:root{--paper:#fafaf7;--ink:#161615;--soft:#55554f;--faint:#94948c;--hair:#e5e4df;--wash:#f0f0eb;
 --ok:#3d7a56;--warn:#a5492f;
 --c1:#3c7591;--c2:#6b8a3a;--c3:#c27f22;--c4:#6f58ad;--c5:#b8483b;
 --display:"Cormorant Garamond",Georgia,serif;--text:"Spectral",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0f0f0e;--ink:#ebeae4;--soft:#b3b2aa;--faint:#74736c;--hair:#262624;--wash:#181817;--ok:#78c497;--warn:#ec9a7c;--c1:#6fb0cf;--c2:#a3c46e;--c3:#e7ac55;--c4:#a893e6;--c5:#e58275;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0f0f0e;--ink:#ebeae4;--soft:#b3b2aa;--faint:#74736c;--hair:#262624;--wash:#181817;--ok:#78c497;--warn:#ec9a7c;--c1:#6fb0cf;--c2:#a3c46e;--c3:#e7ac55;--c4:#a893e6;--c5:#e58275;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:300 17px/1.7 var(--text);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:190px minmax(0,1fr);gap:56px;max-width:1040px;margin:0 auto;padding-inline:24px;padding-block:44px 96px}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr);gap:28px;padding-inline:16px;padding-block:20px 72px}}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 44px);align-self:start;display:flex;flex-direction:column;gap:32px}
@media (max-width:760px){.rail{position:static;flex-direction:row;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 16px}}
.brand{font:300 1.7rem/1 var(--display);background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-align:left}
nav{display:flex;flex-direction:column;gap:2px}
@media (max-width:760px){nav{flex-direction:row;flex-wrap:wrap;gap:0 14px}}
nav button{font:400 .74rem var(--mono);letter-spacing:.1em;text-transform:uppercase;background:none;border:0;padding:5px 0;color:var(--faint);cursor:pointer;text-align:left}
nav button:hover{color:var(--ink)}
nav button[aria-current=true]{color:var(--ink)}
.marks{display:flex;gap:10px}
@media (max-width:760px){.marks{display:none}}
main{min-width:0;max-width:640px}
.label{font:400 .72rem/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0}
h1{font:300 clamp(2.5rem,6.5vw,3.9rem)/1.04 var(--display);margin:12px 0 18px;text-wrap:balance}
h2{font:300 clamp(1.9rem,4.6vw,2.5rem)/1.08 var(--display);margin:0;text-wrap:balance}
p{margin:0 0 14px}
.soft{color:var(--soft)}
.faint{color:var(--faint)}
.mono{font:400 .74rem/1.6 var(--mono);letter-spacing:.04em}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.link{font:inherit;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--faint)}
.link:hover{border-bottom-color:var(--ink)}
.go{font:400 .76rem var(--mono);letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:13px 24px;cursor:pointer}
.go:disabled{opacity:.35;cursor:default}
.quiet{font:400 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;background:none;border:0;color:var(--faint);cursor:pointer;padding:6px 0}
.quiet:hover{color:var(--ink)}
:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
.mk{display:inline-block;flex:none;width:var(--s,34px);height:var(--s,34px);color:var(--faint);transition:color .6s}
.mk svg{width:100%;height:100%;display:block}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sc,var(--ink));flex:none}
.dot.empty{background:none;box-shadow:inset 0 0 0 1px var(--faint)}
.dot.next{box-shadow:0 0 0 3px color-mix(in srgb,var(--sc) 25%,transparent)}
.field{width:100%;height:clamp(280px,50vh,440px);display:block;cursor:crosshair;margin:4px 0 0}
.caption{min-height:1.6em;color:var(--soft)}
.block{margin-top:44px}
.rows{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--hair)}
.rows li{border-bottom:1px solid var(--hair)}
.rows button{display:flex;gap:16px;align-items:center;width:100%;background:none;border:0;padding:14px 0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.rows .t{flex:1;min-width:0;font:400 1.35rem/1.3 var(--display)}
.rows button:hover .t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px;text-decoration-color:var(--faint)}
.rows .m{font:400 .72rem var(--mono);color:var(--faint);white-space:nowrap}
.rows .is-done .t{color:var(--soft)}
.rows button:disabled{cursor:default;opacity:.38}
.rows button:disabled:hover .t{text-decoration:none}
.stage{margin-top:72px;--sc:var(--faint)}
.stage-head{display:flex;gap:18px;align-items:flex-start}
.stage-head p{margin:6px 0 0;max-width:48ch}
.threshold{min-height:clamp(380px,62vh,560px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:26px}
.breath{width:200px;height:200px;max-width:100%;border-radius:50%;background:color-mix(in srgb,var(--sc) 14%,transparent);border:1px solid color-mix(in srgb,var(--sc) 55%,transparent);transform:scale(.42);transition-property:transform;transition-timing-function:ease-in-out}
.breath.in{transform:scale(1)}
.breath-word{font:300 2rem/1 var(--display);min-height:1em}
.steps{counter-reset:s;list-style:none;padding:0;margin:22px 0 0}
.steps li{counter-increment:s;display:flex;gap:14px;margin:8px 0}
.steps li::before{content:counter(s);font:400 .72rem/2.3 var(--mono);color:var(--faint);min-width:1.1em}
.ctx{margin:22px 0 0;padding-left:18px;border-left:1px solid var(--hair)}
.ctx blockquote{margin:4px 0 0;font-style:italic;color:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere}
.work{margin-top:44px}
.timebar{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.timeline{height:1px;background:var(--hair);margin:4px 0 0;overflow:hidden}
.timeline i{display:block;height:100%;width:100%;background:var(--sc);transition:width 1s linear}
.prompt{font:italic 300 1.15rem/1.5 var(--text);color:var(--soft);margin:20px 0 0}
textarea.page{display:block;width:100%;min-height:40vh;border:0;background:transparent;color:var(--ink);font:300 1.2rem/1.8 var(--text);resize:vertical;padding:10px 0;margin:0}
textarea.page:focus{outline:none}
textarea.line{min-height:8em}
input.line{width:100%;font:300 clamp(1.6rem,4vw,2.2rem)/1.3 var(--display);background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--faint);padding:8px 0;margin:8px 0 24px}
input.line:focus{outline:none;border-bottom-color:var(--ink)}
.hint{min-height:1.6em;color:var(--soft);transition:opacity .4s}
.seeds{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 0}
.seeds .dot{width:9px;height:9px}
.gauge{display:flex;gap:14px;align-items:center;margin:16px 0 0}
.gauge .track{flex:1;height:1px;background:var(--hair);position:relative}
.gauge .track i{position:absolute;left:0;top:-1px;height:3px;background:var(--sc)}
.gauge .track b{position:absolute;left:50%;top:-6px;width:1px;height:13px;background:var(--faint)}
details.orig{margin:14px 0 0}
details.orig summary{cursor:pointer;color:var(--faint)}
details.orig div{white-space:pre-wrap;color:var(--faint);font-size:.95rem;margin-top:8px;overflow-wrap:anywhere}
.actions{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px solid var(--hair)}
.oracle{font:italic 300 1.45rem/1.45 var(--display);margin:24px 0 0;max-width:34ch}
.release{font:300 1.2rem/1.8 var(--text);white-space:pre-wrap;padding:10px 0;min-height:40vh;overflow-wrap:anywhere}
.release span{display:inline-block;white-space:pre;transition:transform 2.6s cubic-bezier(.2,.6,.3,1),opacity 2.6s ease-out}
.path{display:flex;gap:9px;align-items:center;margin:4px 0 0;flex-wrap:wrap}
.path .dot{width:10px;height:10px}
.opts{list-style:none;padding:0;margin:22px 0 0;border-top:1px solid var(--hair)}
.opts li{border-bottom:1px solid var(--hair)}
.opts button{display:flex;gap:14px;width:100%;align-items:baseline;background:none;border:0;padding:14px 0;font:300 1.08rem/1.5 var(--text);color:var(--ink);text-align:left;cursor:pointer}
.opts button:disabled{cursor:default}
.opts .k{font:400 .72rem var(--mono);color:var(--faint);min-width:1.2em}
.opts .right .k,.opts .right{color:var(--ok)}
.opts .wrong{color:var(--warn);text-decoration:line-through;text-decoration-thickness:1px}
.entry{padding:22px 0;border-bottom:1px solid var(--hair)}
.entry h3{font:400 1.45rem/1.25 var(--display);margin:6px 0 8px}
.entry .txt{white-space:pre-wrap;overflow-wrap:anywhere}
footer{margin-top:88px;color:var(--faint);font-size:.82rem;max-width:58ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside class="rail"><button class="brand" id="brand" type="button">Из ничего</button><nav id="nav"></nav><div class="marks" id="marks"></div></aside>
<main><div id="view"></div>
<footer>Независимый учебный проект по мотивам идей книги Рика Рубина «Из ничего. Искусство создавать искусство». Он не связан с автором и издателем. Упражнения и подсказки написаны своими словами, текст книги не воспроизводится. Всё, что вы пишете, хранится только в этом браузере.</footer></main>
</div>

<script>
// ---------- Данные ----------
const MODULES = [
  {id:'attention', title:'1. Внимание', idea:'Творчество начинается с того, что вы замечаете. Сначала настраиваем восприятие.'},
  {id:'seed', title:'2. Семя', idea:'Идеи приходят сами. Задача — собирать их и не судить слишком рано.'},
  {id:'experiment', title:'3. Эксперимент', idea:'Играйте, ломайте, пробуйте. Результат пока не важен, важен процесс.'},
  {id:'craft', title:'4. Ремесло', idea:'Идея становится работой через выбор, сокращение и точность.'},
  {id:'completion', title:'5. Завершение', idea:'Закончить — тоже навык: решить, что работа достаточна, и отпустить её.'}
];

const PRACTICES = [
  {id:'a1', mod:'attention', title:'Пять минут тишины', min:5,
   desc:'Сядьте без телефона и музыки. Ваша единственная задача — замечать.',
   steps:['Запустите таймер и сидите спокойно.','Мысленно отмечайте звуки, ощущения, мысли.','После таймера запишите не меньше 10 наблюдений.'],
   prompt:'Что вы заметили? Перечислите наблюдения.'},
  {id:'a2', mod:'attention', title:'Одно место, три взгляда', min:8,
   desc:'Одна и та же комната выглядит по-разному для разных людей.',
   steps:['Выберите место рядом с вами.','Опишите его глазами человека, который видит его впервые.','Опишите глазами того, кто здесь живёт десять лет.','Опишите глазами ребёнка или животного.'],
   prompt:'Три коротких описания одного места.'},
  {id:'a3', mod:'attention', title:'Ритуал начала', min:5,
   desc:'Повторяемое начало помогает перейти из обычного состояния в рабочее.',
   steps:['Придумайте маленькое действие: чай, прогулка, чистый стол, одна и та же песня.','Опишите, как оно будет выглядеть, во сколько и сколько займёт.','Выполните его прямо сейчас и отметьте, что изменилось.'],
   prompt:'Ваш ритуал и что вы почувствовали после него.'},
  {id:'s1', mod:'seed', title:'Десять семян без оценки', min:5,
   desc:'Критик убивает идеи в момент рождения. Дадим им шанс появиться.',
   steps:['Выберите любую область: рассказ, песня, продукт, картина.','За 5 минут запишите 10 идей, даже слабых и странных.','Не вычёркивайте и не оценивайте, пока идёт таймер.'],
   prompt:'Ваш список из 10 идей.'},
  {id:'s2', mod:'seed', title:'Коллекция притяжений', min:6,
   desc:'Вкус — это то, к чему вас тянет. Объяснять причины необязательно.',
   steps:['Назовите 5 вещей, которые вас недавно зацепили: фраза, цвет, звук, кадр.','Не ищите логику, просто запишите.','Затем найдите, что у них общего.'],
   prompt:'Пять вещей и то общее, что вы нашли.'},
  {id:'s3', mod:'seed', title:'Письмо из будущего', min:7,
   desc:'Иногда семя проявляется, когда вы представляете готовое.',
   steps:['Представьте, что ваша работа уже существует и вы её показываете другу.','Опишите её так, как будто она готова: что вы чувствуете, глядя на неё.','Выделите одну деталь, которая вас удивила.'],
   prompt:'Описание «готовой» работы.'},
  {id:'e1', mod:'experiment', title:'Жёсткое ограничение', min:10,
   desc:'Рамки освобождают: меньше вариантов — больше изобретательности.',
   steps:['Выберите небольшую задачу: абзац текста, мелодия из 4 нот, эскиз.','Добавьте строгое правило: только 3 цвета, 50 слов, одна нота в такте.','Сделайте работу в этих рамках.'],
   prompt:'Какое ограничение вы выбрали и что получилось?'},
  {id:'e2', mod:'experiment', title:'Грубый набросок', min:3,
   desc:'Первая версия нужна, чтобы существовать, а не чтобы быть хорошей.',
   steps:['Возьмите идею из практики «Десять семян».','За 3 минуты сделайте самую грубую версию.','Не исправляйте. Остановитесь, когда зазвенит таймер.'],
   prompt:'Что вы сделали? Что показало вам это быстрое действие?'},
  {id:'e3', mod:'experiment', title:'Сделать наоборот', min:6,
   desc:'Переворот привычного часто открывает новое.',
   steps:['Запишите свою текущую идею или работу в одном предложении.','Сформулируйте её полную противоположность.','Сделайте набросок противоположной версии.','Заберите из неё то, что оживляет оригинал.'],
   prompt:'Исходная идея, противоположность и что из неё стоит взять.'},
  {id:'c1', mod:'craft', title:'Сократить вдвое', min:10,
   desc:'Часто сила работы в том, что в ней нет лишнего.',
   steps:['Возьмите свой текст, набросок или план.','Удалите ровно половину, оставьте самое живое.','Сравните: что стало яснее?'],
   prompt:'Что вы убрали и что вы поняли о ядре своей работы?'},
  {id:'c2', mod:'craft', title:'Свежие глаза', min:5,
   desc:'После перерыва вы видите работу почти как чужую.',
   steps:['Отложите работу минимум на день (сегодня — хотя бы на час).','Вернитесь и прочитайте или посмотрите её как зритель.','Отметьте 3 места, где ваше внимание проваливается.'],
   prompt:'Три слабых места и как вы их исправите.'},
  {id:'c3', mod:'craft', title:'Один вопрос', min:5,
   desc:'У сильной работы есть центр. Всё остальное его обслуживает.',
   steps:['Сформулируйте вопрос, на который отвечает ваша работа.','Пройдите по частям и проверьте, служит ли каждая этому вопросу.','Отметьте то, что не служит.'],
   prompt:'Ваш центральный вопрос и список лишнего.'},
  {id:'f1', mod:'completion', title:'Критерий «достаточно»', min:5,
   desc:'Без заранее выбранного финиша работа не заканчивается.',
   steps:['Опишите 3 признака, по которым вы поймёте, что работа готова.','Проверьте свою текущую работу по ним.','Если два из трёх выполнены — объявите её завершённой.'],
   prompt:'Три критерия и результат проверки.'},
  {id:'f2', mod:'completion', title:'Отпустить', min:5,
   desc:'Законченная работа принадлежит миру, а не вам одному.',
   steps:['Выберите, кому вы покажете работу и когда.','Напишите, чего вы боитесь.','Напишите, что получите, если покажете.','Назначьте дату показа.'],
   prompt:'Кому, когда и чего вы боитесь.'}
];


// Сквозной проект: один замысел проходит все этапы, каждый шаг опирается на предыдущие
const PROJECT_STEPS = [
  {id:'p1', mod:'attention', title:'Чем вы заняты', min:3, ctx:[],
   text:'Выберите, над чем будете работать: рассказ, песня, дизайн, проект, речь. Это может быть что угодно. Напишите одной строкой, что это.',
   prompt:'Рабочее название и форма работы.'},
  {id:'p2', mod:'attention', title:'Наблюдения', min:5, ctx:['p1'],
   text:'Посидите с темой в тишине. Не придумывайте, только замечайте: образы, фразы, ощущения, воспоминания, связанные с ней.',
   prompt:'Минимум 10 наблюдений.'},
  {id:'p3', mod:'seed', title:'Семена', min:5, ctx:['p2'],
   text:'Опираясь на наблюдения, запишите как можно больше направлений, в которые работа могла бы пойти. Не оценивайте.',
   prompt:'10 и больше вариантов.'},
  {id:'p4', mod:'seed', title:'Выбор семени', min:5, ctx:['p3'],
   text:'Не выбирайте самое разумное. Выберите то, что тянет сильнее остальных, даже если не можете объяснить почему.',
   prompt:'Выбранное семя и что вас в нём притягивает.'},
  {id:'p5', mod:'experiment', title:'Грубая версия', min:10, ctx:['p4'],
   text:'Сделайте самую быструю и неряшливую версию. Её цель — существовать. Исправлять будете позже.',
   prompt:'Вставьте черновик или опишите, что вы сделали.'},
  {id:'p6', mod:'experiment', title:'Эксперимент', min:10, ctx:['p5'],
   text:'Возьмите черновик и сделайте с ним что-то неожиданное: поменяйте форму, наложите жёсткое ограничение или переверните идею наоборот.',
   prompt:'Что вы изменили и что в новой версии оказалось живее?'},
  {id:'p7', mod:'craft', title:'Центр работы', min:5, ctx:['p4','p6'],
   text:'Найдите вопрос или чувство, вокруг которого всё держится. Проверьте, что служит этому центру, а что отвлекает.',
   prompt:'Центральный вопрос и список лишнего.'},
  {id:'p8', mod:'craft', title:'Сокращение', min:10, ctx:['p7'],
   text:'Уберите лишнее, найденное на предыдущем шаге. Если сомневаетесь, убирайте больше. Работа должна стать яснее.',
   prompt:'Новая версия работы и что вы убрали.'},
  {id:'p9', mod:'completion', title:'Критерий «достаточно»', min:5, ctx:['p7','p8'],
   text:'Определите три признака того, что работа готова, и проверьте по ним текущую версию.',
   prompt:'Три признака и результат проверки.'},
  {id:'p10', mod:'completion', title:'Отпустить', min:5, ctx:['p1','p9'],
   text:'Назначьте, кому и когда вы покажете работу. Напишите, чего вы боитесь и что получите, если покажете.',
   prompt:'Кому, когда, страхи и ожидания.'}

const dayKey = d => d.toISOString().slice(0,10);
function streak(){
  const pSteps = state.project ? Object.values(state.project.steps) : [];
  const days = new Set([...state.entries, ...pSteps].map(e => e.date.slice(0,10)));
  let n = 0, d = new Date();
  if(!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  while(days.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

// ---------- Утилиты ----------
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v == null || v === false) continue;
    if(k === 'class') n.className = v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for(const c of kids.flat()) if(c != null && c !== false) n.append(c);
  return n;
}

// ---------- Поле: семена ложатся по спирали подсолнуха ----------
function drawField(canvas, caption){
  const seeds = state.entries.slice().reverse().map(e => {
    const it = findItem(e.practice); return {e, mod: it ? it.mod : 'attention'};
  });
  const ctx = canvas.getContext('2d'), still = reduceMotion();
  const born = performance.now();
  let pts = [], t = 0;
  canvas.addEventListener('click', ev => {
    const r = canvas.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
    let best = null, bd = 18*18;
    for(const p of pts){ const d = (p.x-x)**2 + (p.y-y)**2; if(d < bd){ bd = d; best = p; } }
    caption.textContent = best ? new Date(best.s.e.date).toLocaleDateString('ru-RU', {day:'numeric', month:'long'}) + ' · ' + best.s.e.title : '';
  });
  function frame(now){
    if(!canvas.isConnected) return;
    const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
    if(canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){ canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr); }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    const cs = getComputedStyle(canvas), cx = w/2, cy = h/2;
    const scale = Math.min(w, h) * .44 / Math.sqrt(Math.max(seeds.length, 30));
    const breathe = still ? 1 : 1 + .012 * Math.sin(t);
    // центр: «ничего», с которого всё начинается
    ctx.globalAlpha = 1; ctx.fillStyle = cs.getPropertyValue('--ink').trim();
    ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI*2); ctx.fill();
    if(!seeds.length){
      ctx.strokeStyle = cs.getPropertyValue('--hair').trim(); ctx.lineWidth = 1;
      for(let k=1; k<=3; k++){ ctx.globalAlpha = 1 - k*.25; ctx.beginPath(); ctx.arc(cx, cy, 14*k*k*breathe, 0, Math.PI*2); ctx.stroke(); }
    }
    pts = seeds.map((s, i) => {
      const a = (i+1) * 2.39996, r = scale * Math.sqrt(i+1) * breathe;
      return {s, x: cx + r*Math.cos(a), y: cy + r*Math.sin(a)};
    });
    pts.forEach((p, i) => {
      let rad = 4.2, alpha = .9;
      const fresh = i === pts.length - 1 && freshAt && Date.now() - freshAt < 4000;
      if(fresh && !still){
        const k = Math.min((now - born) / 1200, 1);
        rad = 4.2 * (1 - Math.pow(1-k, 3));
        ctx.globalAlpha = .5 * (1-k); ctx.strokeStyle = cs.getPropertyValue(STAGE_VAR[p.s.mod]).trim();
        ctx.beginPath(); ctx.arc(p.x, p.y, 4 + 26*k, 0, Math.PI*2); ctx.stroke();
      }
      ctx.globalAlpha = alpha; ctx.fillStyle = cs.getPropertyValue(STAGE_VAR[p.s.mod]).trim();
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(rad, .1), 0, Math.PI*2); ctx.fill();
    });
    t += .012;
    if(!still) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// ---------- Сессия: порог → работа → сохранение ----------
function openSession(id){
  const item = findItem(id), isStep = id.startsWith('p') && PROJECT_STEPS.includes(item);
  const m = MODULES.find(x => x.id === item.mod), sc = stageColor(item.mod);
  const circle = el('div', {class:'breath', 'aria-hidden':'true'});
  const word = el('div', {class:'breath-word'});
  const count = el('p', {class:'mono faint'});
  const enter = el('button', {class:'go', type:'button', onclick: () => work(item, isStep)}, 'Начать');
  const box = el('section', {class:'threshold', style:'--sc:' + sc},
    el('p', {class:'label'}, plain(m.title) + ' · ' + item.title),
    circle, word,
    el('p', {class:'soft', style:'max-width:40ch;margin:0'}, 'Три медленных вдоха. Оставьте за порогом всё, что было до этого.'),
    el('div', {class:'row'}, enter, count));
  show(box);
  if(reduceMotion()){ word.textContent = 'Дышите'; return; }
  let n = 0;
  const cycle = () => {
    if(!box.isConnected) return;
    if(n >= 3){ work(item, isStep); return; }
    count.textContent = (n+1) + ' из 3';
    circle.style.transitionDuration = '4s'; circle.classList.add('in'); word.textContent = 'Вдох';
    setTimeout(() => {
      if(!box.isConnected) return;
      circle.style.transitionDuration = '6s'; circle.classList.remove('in'); word.textContent = 'Выдох';
      setTimeout(() => { n++; cycle(); }, 6000);
    }, 4000);
  };
  setTimeout(cycle, 400);
}

function work(item, isStep){
  const mode = MODES[item.id] || {}, sc = stageColor(item.mod);
  const m = MODULES.find(x => x.id === item.mod), pr = state.project;
  const prev = isStep && pr.steps[item.id];

  // таймер-линия: стартует с первого слова, цифры по запросу
  const total = item.min * 60; let left = total, started = false;
  const fill = el('i');
  const digits = el('span', {class:'mono faint', hidden:true});
  const fmt = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  const timeLabel = el('button', {class:'quiet', type:'button', onclick: () => { digits.hidden = !digits.hidden; }},
    item.min + ' мин · время пойдёт с первого слова');
  function startTime(){
    if(started) return; started = true;
    timeLabel.textContent = 'время'; digits.textContent = fmt(left);
    timerId = setInterval(() => {
      left = Math.max(left - 1, 0); fill.style.width = (left/total*100) + '%'; digits.textContent = fmt(left);
      if(!left){ clearInterval(timerId); say('Время вышло. Можно закончить мысль.'); }
    }, 1000);
  }

  const ta = el('textarea', {class:'page', id:'page-' + item.id, placeholder:'Начните здесь…', 'aria-label': item.prompt});
  if(prev) ta.value = prev.text;
  const hint = el('p', {class:'hint mono'});
  let hintT = null;
  function say(t, ms){ hint.textContent = t; clearTimeout(hintT); if(ms) hintT = setTimeout(() => hint.textContent = '', ms); }

  const extras = [];
  // список: каждая строка — семя
  let seedsRow = null, reached = false;
  if(mode.list){
    seedsRow = el('div', {class:'seeds', 'aria-hidden':'true'});
    extras.push(seedsRow);
  }
  function drawSeeds(){
    if(!seedsRow) return;
    const k = lines(ta.value), target = mode.list;
    seedsRow.replaceChildren(...Array.from({length: Math.max(target, k)}, (_, i) => el('span', {class:'dot' + (i < k ? '' : ' empty')})));
    if(k >= target && !reached){ reached = true; say('Цель достигнута. Можно продолжать или остановиться.', 5000); }
  }
  // без критика
  let free = !!mode.free;
  const freeToggle = mode.free ? el('button', {class:'quiet', type:'button', onclick: () => {
    free = !free; freeToggle.textContent = free ? 'Разрешить правку' : 'Снова без правки';
    say(free ? 'Критик снова молчит.' : 'Правка разрешена.', 3000);
  }}, 'Разрешить правку') : null;
  ta.addEventListener('beforeinput', e => {
    if(!free) return;
    const t = e.inputType || '';
    if(t.startsWith('delete') || t === 'historyUndo' || (t.startsWith('insert') && ta.selectionStart !== ta.selectionEnd)){
      e.preventDefault(); say('Сейчас не время править. Просто продолжайте.', 2500);
    }
  });
  // сокращение
  let orig = null; const gauge = el('div');
  function drawGauge(){
    if(orig == null) return;
    const a = words(orig), b = words(ta.value), pct = a ? Math.round(b/a*100) : 100;
    const bar = el('i', {style:'width:' + Math.min(pct,100) + '%'});
    gauge.replaceChildren(el('div', {class:'gauge'},
      el('span', {class:'mono faint'}, a + ' → ' + b + ' ' + plural(b,'слово','слова','слов')),
      el('div', {class:'track', title:'Отметка посередине — половина'}, bar, el('b')),
      el('span', {class:'mono', style:'color:' + (pct <= 50 ? 'var(--ink)' : 'var(--faint)')}, pct + '%')));
  }
  let reduceStart = null;
  if(mode.reduce){
    if(!prev && typeof mode.reduce === 'string' && pr && pr.steps[mode.reduce]) ta.value = pr.steps[mode.reduce].text;
    reduceStart = el('button', {class:'go', type:'button', onclick: () => {
      if(!words(ta.value)){ say('Сначала нужен исходный текст.', 3000); ta.focus(); return; }
      orig = ta.value; reduceStart.remove();
      gauge.before(el('details', {class:'orig'}, el('summary', {class:'mono'}, 'Исходник · ' + words(orig) + ' ' + plural(words(orig),'слово','слова','слов')), el('div', {}, orig)));
      drawGauge(); say('Убирайте лишнее. Цель — половина.', 4000); ta.focus(); startTime();
    }}, 'Начать сокращение');
    extras.push(gauge);
  }

  ta.addEventListener('input', () => { startTime(); drawSeeds(); drawGauge(); });

  const oracle = el('p', {class:'oracle', hidden:true});
  const stuck = el('button', {class:'quiet', type:'button', onclick: () => {
    let card; do { card = DECK[Math.floor(Math.random()*DECK.length)]; } while(DECK.length > 1 && card === oracle.textContent);
    oracle.textContent = card; oracle.hidden = false; stuck.textContent = 'Другая карта';
  }}, 'Застряли?');

  const saveBtn = el('button', {class:'go', type:'button', onclick: finish}, mode.release ? 'Отпустить' : 'Сохранить');
  function finish(){
    let text = ta.value.trim();
    if(!text){ say('Напишите хотя бы строку.', 3000); ta.focus(); return; }
    if(orig != null) text += '\n\n[было ' + words(orig) + ' ' + plural(words(orig),'слово','слова','слов') + ', стало ' + words(ta.value) + ']';
    const date = new Date().toISOString();
    if(isStep){
      pr.steps[item.id] = {text, date};
      state.entries.unshift({practice:item.id, title:'«' + pr.name + '»: ' + item.title, text, date});
    } else {
      state.entries.unshift({practice:item.id, title:item.title, text, date});
    }
    save(); freshAt = Date.now();
    if(mode.release) release(); else go('home');
  }
  function release(){
    clearInterval(timerId);
    const out = el('div', {class:'release', 'aria-live':'polite'});
    const parts = ta.value.split(/(\s+)/).map(w => el('span', {}, w));
    out.append(...parts);
    ta.replaceWith(out); saveBtn.disabled = true;
    say('Работа больше не только ваша.');
    if(reduceMotion()){ setTimeout(() => go('home'), 1600); return; }
    requestAnimationFrame(() => requestAnimationFrame(() => {
      parts.forEach((s, i) => {
        s.style.transitionDelay = Math.min(i*12, 900) + 'ms';
        s.style.transform = 'translate(' + (Math.random()*60-30) + 'px,' + (-60 - Math.random()*140) + 'px)';
        s.style.opacity = '0';
      });
    }));
    setTimeout(() => go('home'), 3800);
  }

  const ctx = isStep ? item.ctx.filter(c => pr.steps[c]).map(c => {
    const src = PROJECT_STEPS.find(x => x.id === c);
    return el('div', {class:'ctx'}, el('p', {class:'label'}, 'Вы писали: ' + src.title), el('blockquote', {}, pr.steps[c].text));
  }) : [];

  show(
    el('button', {class:'quiet', type:'button', onclick: () => go(isStep ? 'project' : 'practices')}, '← ' + (isStep ? 'Проект' : 'Практики')),
    el('div', {style:'--sc:' + sc},
      el('div', {class:'row', style:'margin-top:20px;gap:16px'}, mark(item.mod, 30, true), el('p', {class:'label'}, (isStep ? pr.name + ' · ' : '') + plain(m.title))),
      el('h1', {}, item.title),
      el('p', {class:'soft'}, isStep ? item.text : item.desc),
      item.steps ? el('ol', {class:'steps'}, item.steps.map(s => el('li', {}, el('span', {}, s)))) : null,
      ...ctx,
      el('div', {class:'work'},
        el('div', {class:'timebar'}, timeLabel, digits),
        el('div', {class:'timeline'}, fill),
        el('p', {class:'prompt'}, item.prompt),
        ...extras, ta, hint,
        el('div', {class:'actions'}, reduceStart || saveBtn, reduceStart ? saveBtn : null, freeToggle, stuck),
        oracle)));
  if(reduceStart) saveBtn.classList.replace('go', 'quiet');
  drawSeeds();
  if(mode.free) say('Этап семян: стирать нельзя. Критик подождёт.', 5000);
  if(mode.reduce) say('Вставьте или напишите исходный текст, затем начните сокращение.');
}

function viewProject(){
  const pr = state.project;
  if(!pr){
    const input = el('input', {type:'text', class:'line', id:'pname', placeholder:'Название вашей работы', 'aria-label':'Название вашей работы'});
    const start = () => { const name = input.value.trim(); if(!name){ input.focus(); return; } state.project = {name, steps:{}}; save(); viewProject(); };
    input.addEventListener('keydown', e => { if(e.key === 'Enter') start(); });
    show(el('p', {class:'label'}, 'Проект'), el('h1', {}, 'Одна работа, пять этапов'),
      el('p', {class:'soft'}, 'Возьмите что-то своё: рассказ, песню, речь, продукт. За десять шагов вы проведёте это от первых наблюдений до показа. Каждый шаг опирается на то, что вы написали раньше.'),
      input, el('button', {class:'go', type:'button', onclick: start}, 'Начать'));
    return;
  }
  const done = PROJECT_STEPS.filter(st => pr.steps[st.id]).length;
  const next = PROJECT_STEPS.find(st => !pr.steps[st.id]);
  show(
    el('p', {class:'label'}, 'Проект · шаг ' + Math.min(done+1, PROJECT_STEPS.length) + ' из ' + PROJECT_STEPS.length),
    el('h1', {}, pr.name),
    el('div', {class:'path', 'aria-label': done + ' из ' + PROJECT_STEPS.length + ' шагов'}, PROJECT_STEPS.map(st =>
      el('span', {class:'dot' + (pr.steps[st.id] ? '' : ' empty') + (st === next ? ' next' : ''), style:'--sc:' + stageColor(st.mod)}))),
    next ? el('div', {class:'row', style:'margin-top:26px'}, el('button', {class:'go', type:'button', onclick: () => openSession(next.id)}, 'Продолжить'),
      el('span', {class:'mono faint'}, next.title))
      : el('p', {class:'soft', style:'margin-top:26px'}, 'Работа прошла весь путь. Теперь она принадлежит не только вам.'),
    ...MODULES.map(m => el('section', {class:'stage', style:'--sc:' + stageColor(m.id)}, stageHead(m),
      el('ul', {class:'rows'}, PROJECT_STEPS.filter(st => st.mod === m.id).map(st => {
        const d = pr.steps[st.id], open = d || st === next;
        return el('li', {class: d ? 'is-done' : null}, el('button', {type:'button', disabled: !open, onclick: () => openSession(st.id)},
          el('span', {class:'dot' + (d ? '' : ' empty')}), el('span', {class:'t'}, st.title),
          el('span', {class:'m'}, d ? 'сделано' : st === next ? 'дальше' : st.min + ' мин')));
      })))),
    el('p', {style:'margin-top:56px'}, armBtn(next ? 'Начать заново' : 'Начать новый проект', 'Нажмите ещё раз, чтобы сбросить', () => { state.project = null; save(); viewProject(); })));
}

function viewQuiz(){
  let i = 0, score = 0;
  function render(){
    if(i >= QUIZ.length){
      state.quiz.last = score; state.quiz.best = Math.max(state.quiz.best, score); save(); renderNav();
      show(el('p', {class:'label'}, 'Вопросы'), el('h1', {}, score + ' из ' + QUIZ.length),
        el('p', {class:'soft'}, score >= 6 ? 'Вы хорошо чувствуете эти идеи. Теперь их стоит прожить в практике.' : 'Эти идеи лучше понимаются руками, чем головой. Попробуйте практики и вернитесь.'),
        el('div', {class:'row'}, el('button', {class:'go', type:'button', onclick: viewQuiz}, 'Ещё раз'),
          el('button', {class:'link', type:'button', onclick: () => go('practices')}, 'К практикам')));
      return;
    }
    const q = QUIZ[i];
    const note = el('p', {class:'oracle', hidden:true});
    const next = el('button', {class:'go', type:'button', hidden:true, onclick: () => { i++; render(); }}, i === QUIZ.length-1 ? 'Итог' : 'Дальше');
    const btns = q.o.map((t, k) => el('button', {type:'button', onclick: () => {
      btns.forEach((b, j) => { b.disabled = true; if(j === q.a) b.classList.add('right'); });
      if(k === q.a) score++; else btns[k].classList.add('wrong');
      note.textContent = q.e; note.hidden = false; next.hidden = false; next.focus();
    }}, el('span', {class:'k'}, String.fromCharCode(1072 + k)), el('span', {}, t)));
    show(el('p', {class:'label'}, 'Вопрос ' + (i+1) + ' из ' + QUIZ.length),
      el('h2', {style:'margin-top:12px'}, q.q),
      el('ul', {class:'opts'}, btns.map(b => el('li', {}, b))), note,
      el('p', {style:'margin-top:24px'}, next));
  }
  render();
}

function viewJournal(){
  if(!state.entries.length){
    show(el('p', {class:'label'}, 'Дневник'), el('h1', {}, 'Пока пусто'),
      el('p', {class:'soft'}, 'Здесь появится всё, что вы напишете в практиках и в проекте.'),
      el('button', {class:'go', type:'button', onclick: () => go('practices')}, 'К практикам'));
    return;
  }
  const exp = el('button', {class:'quiet', type:'button', onclick: () => {
    const json = JSON.stringify(state.entries, null, 2);
    const ok = () => { exp.textContent = 'Скопировано'; setTimeout(() => exp.textContent = 'Копировать как JSON', 2000); };
    (navigator.clipboard ? navigator.clipboard.writeText(json) : Promise.reject()).then(ok).catch(() => {
      const ta = el('textarea', {class:'page line', id:'export'}); ta.value = json; exp.replaceWith(ta); ta.select();
    });
  }}, 'Копировать как JSON');
  show(el('p', {class:'label'}, 'Дневник'), el('h1', {}, 'Всё, что вы написали'),
    el('p', {class:'soft'}, 'Перечитывайте иногда. Семена прорастают не сразу.'), exp,
    el('div', {style:'margin-top:20px;border-top:1px solid var(--hair)'}, state.entries.map((e, idx) => {
      const it = findItem(e.practice);
      return el('article', {class:'entry', style: it ? '--sc:' + stageColor(it.mod) : null},
        el('div', {class:'row', style:'justify-content:space-between'},
          el('span', {class:'row', style:'gap:10px'}, el('span', {class:'dot'}),
            el('span', {class:'mono faint'}, new Date(e.date).toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'}))),
          armBtn('Удалить', 'Точно?', () => { state.entries.splice(idx,1); save(); viewJournal(); })),
        el('h3', {}, e.title), el('div', {class:'txt'}, e.text));
    })));
}

go('home');
</script>
