<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#14110f">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр творческого акта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@300;400;500;600&display=swap">
<style>
/* Концепция: ночная студия записи. Тёплая темнота, свет одной лампы,
   гротеск без украшений, моно-метки как подписи на пульте. Одна тема намеренно. */
:root{--paper:#14110f;--panel:#1c1815;--ink:#f2ebe1;--soft:#b8ad9e;--faint:#7c7265;--hair:#2d2723;
 --amber:#e8a85a;--glow:rgba(232,168,90,.11);--rec:#e5534b;--ok:#93c99d;--warn:#ec8f73;
 --c1:#7fb2c9;--c2:#a4c172;--c3:#d98bb0;--c4:#a596e8;--c5:#e8756a;
 --display:"Onest",system-ui,sans-serif;--text:"Onest",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
 color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:400 16px/1.7 var(--text);-webkit-font-smoothing:antialiased}
::selection{background:var(--amber);color:var(--paper)}
.app{display:grid;grid-template-columns:190px minmax(0,1fr);gap:56px;max-width:1040px;margin:0 auto;padding-inline:24px;padding-block:44px 96px}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr);gap:28px;padding-inline:16px;padding-block:20px 72px}}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 44px);align-self:start;display:flex;flex-direction:column;gap:32px}
@media (max-width:760px){.rail{position:static;flex-direction:row;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 16px}}
.brand{font:600 1.15rem/1 var(--display);letter-spacing:-.01em;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-align:left}
nav{display:flex;flex-direction:column;gap:2px}
@media (max-width:760px){nav{flex-direction:row;flex-wrap:wrap;gap:0 14px}}
nav button{font:400 .74rem var(--mono);letter-spacing:.1em;text-transform:uppercase;background:none;border:0;padding:5px 0;color:var(--faint);cursor:pointer;text-align:left}
nav button:hover{color:var(--ink)}
nav button[aria-current=true]{color:var(--amber)}
.marks{display:flex;gap:10px}
@media (max-width:760px){.marks{display:none}}
main{min-width:0;max-width:640px}
.label{font:400 .72rem/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0}
h1{font:500 clamp(2.2rem,6vw,3.5rem)/1.05 var(--display);letter-spacing:-.025em;margin:12px 0 18px;text-wrap:balance}
h2{font:500 clamp(1.6rem,4vw,2.1rem)/1.12 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
p{margin:0 0 14px}
.soft{color:var(--soft)}
.faint{color:var(--faint)}
.mono{font:400 .74rem/1.6 var(--mono);letter-spacing:.04em}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.link{font:inherit;background:none;border:0;padding:0;color:var(--amber);cursor:pointer;border-bottom:1px solid color-mix(in srgb,var(--amber) 40%,transparent)}
.link:hover{border-bottom-color:var(--amber)}
.go{font:500 .74rem var(--mono);letter-spacing:.14em;text-transform:uppercase;background:var(--amber);color:var(--paper);border:0;border-radius:4px;padding:13px 22px;cursor:pointer;box-shadow:0 0 28px -6px var(--amber)}
.go:hover{filter:brightness(1.08)}
.go:disabled{opacity:.35;cursor:default}
.quiet{font:400 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;background:none;border:0;color:var(--faint);cursor:pointer;padding:6px 0}
.quiet:hover{color:var(--ink)}
:focus-visible{outline:1px solid var(--amber);outline-offset:4px}
.mk{display:inline-block;flex:none;width:var(--s,34px);height:var(--s,34px);color:var(--faint);transition:color .6s}
.mk svg{width:100%;height:100%;display:block}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sc,var(--ink));flex:none}
.dot.empty{background:none;box-shadow:inset 0 0 0 1px var(--faint)}
.dot.next{box-shadow:0 0 0 3px color-mix(in srgb,var(--sc) 25%,transparent)}
.field{width:100%;height:clamp(210px,34vh,320px);display:block;cursor:crosshair;margin:4px 0 0}
.caption{min-height:1.6em;color:var(--soft)}
.block{margin-top:44px}
.rows{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--hair)}
.rows li{border-bottom:1px solid var(--hair)}
.rows button{display:flex;gap:16px;align-items:center;width:100%;background:none;border:0;padding:14px 0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.rows .t{flex:1;min-width:0;font:400 1.12rem/1.35 var(--display);letter-spacing:-.01em}
.rows button:hover .t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px;text-decoration-color:var(--faint)}
.rows .m{font:400 .72rem var(--mono);color:var(--faint);white-space:nowrap}
.rows .is-done .t{color:var(--soft)}
.rows button:disabled{cursor:default;opacity:.38}
.rows button:disabled:hover .t{text-decoration:none}
.stage{margin-top:72px;--sc:var(--faint)}
.stage-head{display:flex;gap:18px;align-items:flex-start}
.stage-head p{margin:6px 0 0;max-width:48ch}
.threshold{min-height:clamp(380px,62vh,560px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:26px}
.breath{width:200px;height:200px;max-width:100%;border-radius:50%;background:color-mix(in srgb,var(--sc) 14%,transparent);border:1px solid color-mix(in srgb,var(--sc) 55%,transparent);transform:scale(.42);transition-property:transform;transition-timing-function:ease-in-out}
.breath.in{transform:scale(1)}
.breath-word{font:300 1.8rem/1 var(--display);letter-spacing:.02em;min-height:1em}
.steps{counter-reset:s;list-style:none;padding:0;margin:22px 0 0}
.steps li{counter-increment:s;display:flex;gap:14px;margin:8px 0}
.steps li::before{content:counter(s);font:400 .72rem/2.3 var(--mono);color:var(--faint);min-width:1.1em}
.ctx{margin:22px 0 0;padding-left:18px;border-left:1px solid var(--hair)}
.ctx blockquote{margin:4px 0 0;color:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere}
.work{margin-top:44px}
.timebar{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.timeline{height:1px;background:var(--hair);margin:4px 0 0;overflow:hidden}
.timeline i{display:block;height:100%;width:100%;background:var(--sc);transition:width 1s linear}
.prompt{font:400 1.08rem/1.5 var(--text);color:var(--soft);margin:20px 0 0}
textarea.page{display:block;width:100%;min-height:36vh;border:1px solid var(--hair);border-radius:6px;background:var(--panel);color:var(--ink);caret-color:var(--amber);font:400 1.12rem/1.8 var(--text);resize:vertical;padding:16px 18px;margin:12px 0 0}
textarea.page:focus{outline:none;border-color:color-mix(in srgb,var(--amber) 45%,var(--hair))}
textarea.line{min-height:8em}
input.line{width:100%;caret-color:var(--amber);font:500 clamp(1.5rem,4vw,2rem)/1.3 var(--display);letter-spacing:-.02em;background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--faint);padding:8px 0;margin:8px 0 24px}
input.line:focus{outline:none;border-bottom-color:var(--amber)}
.hint{min-height:1.6em;color:var(--soft);transition:opacity .4s}
.seeds{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 0}
.seeds .dot{width:9px;height:9px}
.gauge{display:flex;gap:14px;align-items:center;margin:16px 0 0}
.gauge .track{flex:1;height:1px;background:var(--hair);position:relative}
.gauge .track i{position:absolute;left:0;top:-1px;height:3px;background:var(--sc)}
.gauge .track b{position:absolute;left:50%;top:-6px;width:1px;height:13px;background:var(--faint)}
details.orig{margin:14px 0 0}
details.orig summary{cursor:pointer;color:var(--faint)}
details.orig div{white-space:pre-wrap;color:var(--faint);font-size:.95rem;margin-top:8px;overflow-wrap:anywhere}
.actions{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px solid var(--hair)}
.oracle{font:400 1.3rem/1.45 var(--display);letter-spacing:-.01em;color:var(--amber);margin:24px 0 0;max-width:34ch}
.release{font:400 1.12rem/1.8 var(--text);white-space:pre-wrap;padding:16px 18px;margin-top:12px;min-height:40vh;overflow-wrap:anywhere}
.release span{display:inline-block;white-space:pre;transition:transform 2.6s cubic-bezier(.2,.6,.3,1),opacity 2.6s ease-out}
.path{display:flex;gap:9px;align-items:center;margin:4px 0 0;flex-wrap:wrap}
.path .dot{width:10px;height:10px}
.opts{list-style:none;padding:0;margin:22px 0 0;border-top:1px solid var(--hair)}
.opts li{border-bottom:1px solid var(--hair)}
.opts button{display:flex;gap:14px;width:100%;align-items:baseline;background:none;border:0;padding:14px 0;font:400 1.05rem/1.5 var(--text);color:var(--ink);text-align:left;cursor:pointer}
.opts button:disabled{cursor:default}
.opts .k{font:400 .72rem var(--mono);color:var(--faint);min-width:1.2em}
.opts .right .k,.opts .right{color:var(--ok)}
.opts .wrong{color:var(--warn);text-decoration:line-through;text-decoration-thickness:1px}
.entry{padding:22px 0;border-bottom:1px solid var(--hair)}
.entry h3{font:500 1.2rem/1.3 var(--display);letter-spacing:-.01em;margin:6px 0 8px}
.entry .txt{white-space:pre-wrap;overflow-wrap:anywhere}
footer{margin-top:88px;color:var(--faint);font-size:.82rem;max-width:58ch}
.rec{display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rec);box-shadow:0 0 10px var(--rec);animation:rec 1.6s ease-in-out infinite}
@keyframes rec{50%{opacity:.35}}
.sec{margin-top:44px}
.sec>.label{margin-bottom:10px}
.timer-digits{font:500 2.2rem/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.rows .tw{flex:1;min-width:0}
.rows .tw .t{display:block}
.rows .d{display:block;font-size:.9rem;line-height:1.5;color:var(--soft);margin-top:3px}
.rows .num{font:400 .74rem var(--mono);color:var(--faint);min-width:1.4em}
.rows .m.next{color:var(--amber)}
.crumbs{display:flex;gap:10px 18px;align-items:baseline;flex-wrap:wrap}
.pager{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:56px;padding-top:18px;border-top:1px solid var(--hair)}
/* ---------- Медленное движение ---------- */
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;
 background:radial-gradient(38% 32% at 18% 12%,var(--glow),transparent 70%),radial-gradient(30% 26% at 85% 90%,rgba(232,168,90,.05),transparent 70%);
 animation:lamp 48s ease-in-out infinite alternate}
@keyframes lamp{0%{transform:translate(0,0);opacity:.75}50%{opacity:1}100%{transform:translate(7%,5%);opacity:.8}}
#view>*{animation:rise 1.2s cubic-bezier(.2,.6,.2,1) backwards}
#view>*:nth-child(2){animation-delay:.1s}#view>*:nth-child(3){animation-delay:.2s}#view>*:nth-child(4){animation-delay:.3s}#view>*:nth-child(5){animation-delay:.4s}#view>*:nth-child(n+6){animation-delay:.5s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.go{animation:glow 7s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 40px -4px var(--amber)}}
.mk svg *{transform-box:fill-box;transform-origin:center}
.mk .rip{opacity:0}
.mk.live .rip{animation:rip 9s ease-out infinite}
.mk.live .base{opacity:.12}
@keyframes rip{0%{transform:scale(.12);opacity:0}25%{opacity:.7}100%{transform:scale(1);opacity:0}}
.mk.live .pulse{animation:pulse 7s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.22);opacity:.75}}
.mk.live .drift{animation:drift var(--t,11s) ease-in-out var(--d,0s) infinite alternate}
@keyframes drift{to{transform:translate(var(--x,2px),var(--y,-3px))}}
.mk.live .sway{animation:sway 12s ease-in-out infinite alternate}
.mk.live .sway.rev{animation-duration:15s;animation-direction:alternate-reverse}
.mk.live .tilt{animation:tilt 17s ease-in-out infinite alternate}
@keyframes sway{to{transform:translate(3px,-2px)}}
@keyframes tilt{from{transform:rotate(-5deg)}to{transform:rotate(7deg)}}
.mk.live .cut{animation:cut 9s ease-in-out infinite}
@keyframes cut{50%{opacity:.04}}
.mk .ring{transform:rotate(-90deg)}
.mk .l1{transform-origin:right bottom}
.mk .l2{transform-origin:left bottom}
.mk.live .shoot{stroke-dasharray:32;animation:shoot 14s ease-in-out infinite}
.mk.live .leaf{animation:unfold 14s ease-in-out infinite}
.mk.live .l2{animation-delay:.6s}
@keyframes shoot{0%{stroke-dashoffset:32;opacity:1}38%{stroke-dashoffset:0}86%{stroke-dashoffset:0;opacity:1}96%{opacity:0}100%{stroke-dashoffset:32;opacity:0}}
@keyframes unfold{0%,30%{transform:scale(0)}55%{transform:scale(1)}86%{transform:scale(1);opacity:.85}96%{opacity:0}100%{transform:scale(0);opacity:0}}
.mk .halo{opacity:0}
.mk.live .halo{opacity:.15}
.mk.live .ring{stroke-dasharray:151;animation:ring 16s ease-in-out infinite}
@keyframes ring{0%{stroke-dashoffset:151}45%,70%{stroke-dashoffset:0}100%{stroke-dashoffset:-151}}
.timeline.on i{background:linear-gradient(90deg,var(--sc) 0%,color-mix(in srgb,var(--sc) 35%,var(--ink)) 50%,var(--sc) 100%);background-size:200% 100%;animation:shim 7s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.oracle:not([hidden]){animation:emerge 2.2s ease-out}
@keyframes emerge{from{opacity:0;filter:blur(8px);transform:translateY(6px)}}
.hint{animation:none}
.hint.show{animation:fadein 1.2s ease-out}
@keyframes fadein{from{opacity:0}}
.seeds .dot.new{animation:sprout 1.6s cubic-bezier(.2,.7,.2,1)}
@keyframes sprout{from{transform:scale(0);box-shadow:0 0 0 0 var(--sc)}60%{box-shadow:0 0 14px 2px var(--sc)}}
.breath{position:relative}
.breath::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid color-mix(in srgb,var(--sc) 45%,transparent);animation:rip 6s ease-out infinite}
.done-mark{margin:8px 0 4px}
/* ---------- Цикл и фокус ---------- */
.cycle{list-style:none;margin:40px 0 0;padding:0}
.cstep{border-top:1px solid var(--hair);opacity:.28;transition:opacity 1.4s ease;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 20px)}
.cstep:last-child{border-bottom:1px solid var(--hair)}
.cstep.is-done{opacity:.5}
.cstep.can-back:hover{opacity:.85}
.cstep.is-focus{opacity:1}
.chead{display:flex;gap:18px;align-items:baseline;width:100%;background:none;border:0;padding:20px 0;color:inherit;font:inherit;text-align:left;cursor:default}
.can-back .chead{cursor:pointer}
.cnum{font:400 .74rem var(--mono);color:var(--faint);min-width:1.4em}
.is-focus .cnum{color:var(--amber)}
.ctitle{flex:1;min-width:0;font:500 1.2rem/1.25 var(--display);letter-spacing:-.015em}
.is-focus .ctitle{font-size:clamp(1.6rem,4.2vw,2.2rem)}
.csum{font:400 .72rem var(--mono);color:var(--faint);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbody{padding:0 0 40px calc(1.4em + 18px);animation:rise 1.4s cubic-bezier(.2,.6,.2,1)}
@media (max-width:600px){.cbody{padding-left:0}}
.breath-wrap{--sc:var(--amber);display:flex;align-items:center;gap:28px;margin:22px 0 4px;flex-wrap:wrap}
.breath-wrap .breath{width:150px;height:150px}
.pick{margin:18px 0 0;padding:22px 0 4px;border-top:1px solid var(--hair)}
.stage.dim{opacity:.42;transition:opacity .9s}
.stage.dim:hover,.stage.dim:focus-within{opacity:1}
.dimmable>li,.dimmable>article{opacity:.5;transition:opacity .9s}
.block.faded{opacity:.55;transition:opacity .9s}
.block.faded:hover,.block.faded:focus-within{opacity:1}
.cstep.is-focus.can-back:hover{opacity:1}
.cstep .chead .mk{align-self:center}
.dimmable>li:hover,.dimmable>article:hover,.dimmable>.focus,.dimmable>li:focus-within{opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
@media (prefers-reduced-motion:reduce){.rec::before{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside class="rail"><button class="brand" id="brand" type="button">Из ничего</button><nav id="nav"></nav><div class="marks" id="marks"></div></aside>
<main><div id="view"></div>
<footer>Независимый учебный проект по мотивам идей книги Рика Рубина «Из ничего. Искусство создавать искусство». Он не связан с автором и издателем. Упражнения и подсказки написаны своими словами, текст книги не воспроизводится. Всё, что вы пишете, хранится только в этом браузере.</footer></main>
</div>

<script>
// ---------- Данные ----------
const MODULES = [
  {id:'attention', title:'1. Внимание', idea:'Творчество начинается с того, что вы замечаете. Сначала настраиваем восприятие.'},
  {id:'seed', title:'2. Семя', idea:'Идеи приходят сами. Задача — собирать их и не судить слишком рано.'},
  {id:'experiment', title:'3. Эксперимент', idea:'Играйте, ломайте, пробуйте. Результат пока не важен, важен процесс.'},
  {id:'craft', title:'4. Ремесло', idea:'Идея становится работой через выбор, сокращение и точность.'},
  {id:'completion', title:'5. Завершение', idea:'Закончить — тоже навык: решить, что работа достаточна, и отпустить её.'}
];

const PRACTICES = [
  {id:'a1', mod:'attention', title:'Пять минут тишины', min:5,
   desc:'Сядьте без телефона и музыки. Ваша единственная задача — замечать.',
   steps:['Запустите таймер и сидите спокойно.','Мысленно отмечайте звуки, ощущения, мысли.','После таймера запишите всё, что заметили. Сколько получится.'],
   prompt:'Что вы заметили? Перечислите наблюдения.'},
  {id:'a2', mod:'attention', title:'Одно место, три взгляда', min:8,
   desc:'Одна и та же комната выглядит по-разному для разных людей.',
   steps:['Выберите место рядом с вами.','Опишите его глазами человека, который видит его впервые.','Опишите глазами того, кто здесь живёт десять лет.','Опишите глазами ребёнка или животного.'],
   prompt:'Три коротких описания одного места.'},
  {id:'a3', mod:'attention', title:'Ритуал начала', min:5,
   desc:'Повторяемое начало помогает перейти из обычного состояния в рабочее.',
   steps:['Придумайте маленькое действие: чай, прогулка, чистый стол, одна и та же песня.','Опишите, как оно будет выглядеть, во сколько и сколько займёт.','Выполните его прямо сейчас и отметьте, что изменилось.'],
   prompt:'Ваш ритуал и что вы почувствовали после него.'},
  {id:'s1', mod:'seed', title:'Десять семян без оценки', min:5,
   desc:'Критик убивает идеи в момент рождения. Дадим им шанс появиться.',
   steps:['Выберите любую область: рассказ, песня, продукт, картина.','За 5 минут запишите 10 идей, даже слабых и странных.','Не вычёркивайте и не оценивайте, пока идёт таймер.'],
   prompt:'Ваш список из 10 идей.'},
  {id:'s2', mod:'seed', title:'Коллекция притяжений', min:6,
   desc:'Вкус — это то, к чему вас тянет. Объяснять причины необязательно.',
   steps:['Назовите 5 вещей, которые вас недавно зацепили: фраза, цвет, звук, кадр.','Не ищите логику, просто запишите.','Затем найдите, что у них общего.'],
   prompt:'Пять вещей и то общее, что вы нашли.'},
  {id:'s3', mod:'seed', title:'Письмо из будущего', min:7,
   desc:'Иногда семя проявляется, когда вы представляете готовое.',
   steps:['Представьте, что ваша работа уже существует и вы её показываете другу.','Опишите её так, как будто она готова: что вы чувствуете, глядя на неё.','Выделите одну деталь, которая вас удивила.'],
   prompt:'Описание «готовой» работы.'},

const dayKey = d => d.toISOString().slice(0,10);
function streak(){
  const pSteps = state.project ? Object.values(state.project.steps) : [];
  const days = new Set([...state.entries, ...pSteps].map(e => e.date.slice(0,10)));
  let n = 0, d = new Date();
  if(!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  while(days.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v == null || v === false) continue;
    if(k === 'class') n.className = v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for(const c of kids.flat()) if(c != null && c !== false) n.append(c);
  return n;
}

// ---------- Поле: каждая запись — посаженное семя, которое прорастает со временем ----------
// возраст записи → фаза роста: росток (сегодня), побег (1+ день), стебель (3+), цветок (7+)
const GROWTH = ['росток', 'побег', 'крепкий стебель', 'цветёт'];
const growthOf = date => { const d = (Date.now() - new Date(date)) / 864e5; return d < 1 ? 0 : d < 3 ? 1 : d < 7 ? 2 : 3; };

function drawField(canvas, caption){
  const seeds = state.entries.slice().reverse().map(e => {
    const it = findItem(e.practice); return {e, mod: it ? it.mod : 'attention', g: growthOf(e.date)};
  });
  const ctx = canvas.getContext('2d'), still = reduceMotion();
  const born = performance.now();
  let hits = [], t = 0;
  canvas.addEventListener('click', ev => {
    const r = canvas.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
    let best = null, bd = Infinity;
    for(const h of hits){ const d = (h.x-x)**2 + (h.y-y)**2; if(d < h.r*h.r && d < bd){ bd = d; best = h; } }
    caption.textContent = best ? new Date(best.s.e.date).toLocaleDateString('ru-RU', {day:'numeric', month:'long'}) + ' · ' + best.s.e.title + ' · ' + GROWTH[best.s.g] : '';
  });
  const ease = k => 1 - Math.pow(1 - Math.min(Math.max(k, 0), 1), 3);

  function leaf(x, y, len, ang, col){
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(len*.5, -len*.42, len, 0); ctx.quadraticCurveTo(len*.5, len*.42, 0, 0);
    ctx.fillStyle = col; ctx.fill(); ctx.restore();
  }

  function plant(x, ground, sc, col, seedCol, g, sway, grow, drop){
    // семя в земле
    ctx.globalAlpha = .95; ctx.fillStyle = seedCol;
    ctx.beginPath(); ctx.ellipse(x, ground + 3*sc - drop, 3.6*sc, 2.3*sc, -.35, 0, Math.PI*2); ctx.fill();
    if(grow <= 0) return {top: ground, H: 0};
    const H = [11, 20, 30, 38][g] * sc * grow;
    const tx = x + sway * H, ty = ground - H;
    ctx.strokeStyle = col; ctx.lineWidth = 1.5 * sc; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, ground); ctx.quadraticCurveTo(x - sway*H*.3, ground - H*.55, tx, ty); ctx.stroke();
    const at = f => [x + (tx - x)*f*f, ground - H*f];
    const L = 6.5 * sc * Math.min(grow*1.4, 1);
    // листья: по паре на каждую фазу роста
    const pairs = [[.85], [.55, .9], [.4, .68], [.3, .55, .78]][g];
    pairs.forEach((f, k) => {
      const [lx, ly] = at(f), size = L * (g === 0 ? .7 : 1 - k*.12);
      leaf(lx, ly, size, Math.PI + .55 + sway, col);
      leaf(lx, ly, size, -.55 + sway, col);
    });
    if(g === 3 && grow > .9){
      // цветок: пять лепестков цвета этапа вокруг светлой сердцевины
      ctx.save(); ctx.shadowBlur = 10*sc; ctx.shadowColor = seedCol;
      for(let k = 0; k < 5; k++){ const a = k*1.2566 + t*.1; leaf(tx, ty, 4.6*sc, a, seedCol); }
      ctx.restore();
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(tx, ty, 1.6*sc, 0, Math.PI*2); ctx.fill();
    } else if(g >= 1){
      ctx.fillStyle = seedCol; ctx.beginPath(); ctx.ellipse(tx, ty - 1.5*sc, 1.6*sc, 2.6*sc, sway, 0, Math.PI*2); ctx.fill();
    }
    return {top: ty, H};
  }

  function frame(now){
    if(!canvas.isConnected) return;
    const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
    if(canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){ canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr); }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    const cs = getComputedStyle(canvas), col = v => cs.getPropertyValue(v).trim();
    const amber = col('--amber'), hair = col('--hair'), soft = col('--faint');
    // три борозды: дальние выше, мельче и тусклее
    const rows = [{y: h*.9, sc: 1.9, a: 1}, {y: h*.7, sc: 1.5, a: .8}, {y: h*.52, sc: 1.15, a: .6}];
    // свет лампы над полем
    const glow = ctx.createRadialGradient(w*.5, h*.95, 4, w*.5, h*.95, w*.55);
    glow.addColorStop(0, 'rgba(232,168,90,' + (still ? .1 : .08 + .04*Math.sin(t*.4)) + ')'); glow.addColorStop(1, 'rgba(232,168,90,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = glow; ctx.fillRect(0, 0, w, h);
    rows.forEach(r => { ctx.globalAlpha = .9 * r.a; ctx.strokeStyle = hair; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(w*.04, r.y); ctx.lineTo(w*.96, r.y); ctx.stroke(); });

    if(!seeds.length){
      // пустое поле: одно непосаженное семя ждёт над землёй
      const bob = still ? 0 : Math.sin(t*.6) * 3;
      ctx.globalAlpha = .9; ctx.strokeStyle = amber; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.ellipse(w/2, rows[0].y - 18 + bob, 5, 3.2, -.35, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([2, 4]); ctx.globalAlpha = .35;
      ctx.beginPath(); ctx.moveTo(w/2, rows[0].y - 12 + bob); ctx.lineTo(w/2, rows[0].y - 2); ctx.stroke(); ctx.setLineDash([]);
    }

    hits = [];
    // сначала дальние борозды, чтобы ближние перекрывали их
    const placed = seeds.map((s, i) => {
      const row = i % 3, slot = Math.floor(i / 3);
      const fx = .5 + (((slot * .618034 + row * .38 + .5) % 1) - .5) * .9;
      return {s, i, row, x: w * fx};
    }).sort((a, b) => b.row - a.row);
    placed.forEach(({s, i, row, x}) => {
      const r = rows[row], c = col(STAGE_VAR[s.mod]);
      const sway = still ? 0 : Math.sin(t*.45 + i*1.7) * .07;
      let grow = 1, drop = 0;
      const fresh = i === seeds.length - 1 && freshAt && Date.now() - freshAt < 6000;
      if(fresh && !still){
        const k = (now - born) / 1000;
        drop = (1 - ease(k / .9)) * 40;          // семя опускается в землю
        grow = ease((k - 1) / 2.2);              // потом медленно прорастает
        if(k > 1 && k < 4){ ctx.globalAlpha = .35 * (1 - (k-1)/3); ctx.strokeStyle = c; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.ellipse(x, r.y, 6 + 30*(k-1)/3, 2 + 6*(k-1)/3, 0, 0, Math.PI*2); ctx.stroke(); }
      }
      ctx.globalAlpha = r.a;
      const {top, H} = plant(x, r.y, r.sc, c, s.g === 3 ? c : amber, s.g, sway, grow, drop);
      hits.push({s, x, y: (r.y + top) / 2, r: Math.max(H/2 + 10, 16)});
    });
    t += .012;
    if(!still) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function practiceOfDay(){
  const done = doneIds();
  const left = PRACTICES.filter(p => !done.has(p.id));
  const pool = left.length ? left : PRACTICES;
  return pool[Number(dayKey(new Date()).replaceAll('-','')) % pool.length];
}
// следующая по порядку пути; когда всё пройдено — практика дня
const suggested = () => { const done = doneIds(); return PRACTICES.find(p => !done.has(p.id)) || practiceOfDay(); };
function nextPractice(afterId){
  const done = doneIds(), i = PRACTICES.findIndex(p => p.id === afterId);
  for(let k = 1; k <= PRACTICES.length; k++){ const p = PRACTICES[(i+k) % PRACTICES.length]; if(!done.has(p.id)) return p; }

}

      : 'Этапы идут в том порядке, в каком обычно рождается работа. В фокусе этап, в котором вы сейчас; остальные ждут в тени, их можно открыть.'),

function openSession(id){
  const item = findItem(id), isStep = PROJECT_STEPS.includes(item);
  currentTab = isStep ? 'project' : 'practices'; renderNav();

}


function breathe(id){
  const item = findItem(id), isStep = id.startsWith('p') && PROJECT_STEPS.includes(item);
  const m = MODULES.find(x => x.id === item.mod), sc = stageColor(item.mod);
  const circle = el('div', {class:'breath', 'aria-hidden':'true'});
  const word = el('div', {class:'breath-word'});
  const count = el('p', {class:'mono faint'});
  const enter = el('button', {class:'go', type:'button', onclick: () => work(item, isStep)}, 'Начать');
  const box = el('section', {class:'threshold', style:'--sc:' + sc},
    el('p', {class:'label'}, plain(m.title) + ' · ' + item.title),
    circle, word,
    el('p', {class:'soft', style:'max-width:40ch;margin:0'}, 'Три медленных вдоха. Оставьте за порогом всё, что было до этого.'),
    el('div', {class:'row'}, enter, count));
  show(box);
  if(reduceMotion()){ word.textContent = 'Дышите'; return; }
  let n = 0;
  const cycle = () => {
    if(!box.isConnected) return;
    if(n >= 3){ work(item, isStep); return; }
    count.textContent = (n+1) + ' из 3';
    circle.style.transitionDuration = '4s'; circle.classList.add('in'); word.textContent = 'Вдох';
    setTimeout(() => {
      if(!box.isConnected) return;
      circle.style.transitionDuration = '6s'; circle.classList.remove('in'); word.textContent = 'Выдох';
      setTimeout(() => { n++; cycle(); }, 6000);
    }, 4000);
  };
  setTimeout(cycle, 400);
}


function work(item, isStep){
  const mode = MODES[item.id] || {}, sc = stageColor(item.mod);
  const m = MODULES.find(x => x.id === item.mod), pr = state.project;
  const prev = isStep && pr.steps[item.id];

  // время: явная кнопка, цифры на виду; если начать писать, запустится само
  const total = item.min * 60; let left = total, running = false, everStarted = false;
  const fill = el('i');
  const fmt = n => String(Math.floor(n/60)).padStart(2,'0') + ':' + String(n%60).padStart(2,'0');
  const digits = el('span', {class:'timer-digits'}, fmt(left));
  const timeLabel = el('span', {class:'mono faint'}, 'не запущено');
  const timeBtn = el('button', {class:'go', type:'button', onclick: () => running ? pauseTime() : startTime()}, 'Старт');
  function startTime(){
    if(running || !left) return; running = everStarted = true;
    timeBtn.textContent = 'Пауза'; timeBtn.classList.replace('go', 'quiet');
    timeLabel.textContent = 'идёт запись'; timeLabel.classList.add('rec'); fill.parentNode && fill.parentNode.classList.add('on');
    timerId = setInterval(() => {
      left = Math.max(left - 1, 0); fill.style.width = (left/total*100) + '%'; digits.textContent = fmt(left);
      if(!left){ clearInterval(timerId); running = false; timeBtn.hidden = true; fill.parentNode.classList.remove('on'); timeLabel.classList.remove('rec'); timeLabel.textContent = 'время вышло'; say('Время вышло. Можно закончить мысль.'); }
    }, 1000);
  }
  function pauseTime(){
    clearInterval(timerId); running = false; timeBtn.textContent = 'Продолжить'; fill.parentNode.classList.remove('on');
    timeLabel.classList.remove('rec'); timeLabel.textContent = 'пауза';
  }
  const ta = el('textarea', {class:'page', id:'page-' + item.id, placeholder:'Начните здесь…', 'aria-label': item.prompt});
  if(prev) ta.value = prev.text;
  const hint = el('p', {class:'hint mono'});
  let hintT = null;
  function say(t, ms){ if(t && t !== hint.textContent){ hint.classList.remove('show'); void hint.offsetWidth; hint.classList.add('show'); } hint.textContent = t; clearTimeout(hintT); if(ms) hintT = setTimeout(() => hint.textContent = '', ms); }

  const extras = [];
  // список: каждая строка — семя
  let seedsRow = null, reached = false, lastK = Infinity;
  if(mode.list){
    seedsRow = el('div', {class:'seeds', 'aria-hidden':'true'});
    extras.push(seedsRow);
  }
  function drawSeeds(){
    if(!seedsRow) return;
    const k = lines(ta.value), target = mode.list;
    seedsRow.replaceChildren(...Array.from({length: Math.max(target, k)}, (_, i) => el('span', {class:'dot' + (i < k ? '' : ' empty') + (i === k-1 && k > lastK ? ' new' : '')})));
    lastK = k;
    if(k >= target && !reached){ reached = true; say('Цель достигнута. Можно продолжать или остановиться.', 5000); }
  }
  // без критика
  let free = !!mode.free;
  const freeToggle = mode.free ? el('button', {class:'quiet', type:'button', onclick: () => {
    free = !free; freeToggle.textContent = free ? 'Разрешить правку' : 'Снова без правки';
    say(free ? 'Критик снова молчит.' : 'Правка разрешена.', 3000);
  }}, 'Разрешить правку') : null;
  ta.addEventListener('beforeinput', e => {
    if(!free) return;
    const t = e.inputType || '';
    if(t.startsWith('delete') || t === 'historyUndo' || (t.startsWith('insert') && ta.selectionStart !== ta.selectionEnd)){
      e.preventDefault(); say('Сейчас не время править. Просто продолжайте.', 2500);
    }
  });
  // сокращение
  let orig = null; const gauge = el('div');
  function drawGauge(){
    if(orig == null) return;
    const a = words(orig), b = words(ta.value), pct = a ? Math.round(b/a*100) : 100;
    const bar = el('i', {style:'width:' + Math.min(pct,100) + '%'});
    gauge.replaceChildren(el('div', {class:'gauge'},
      el('span', {class:'mono faint'}, a + ' → ' + b + ' ' + plural(b,'слово','слова','слов')),
      el('div', {class:'track', title:'Отметка посередине — половина'}, bar, el('b')),
      el('span', {class:'mono', style:'color:' + (pct <= 50 ? 'var(--ink)' : 'var(--faint)')}, pct + '%')));
  }
  let reduceStart = null;
  if(mode.reduce){
    if(!prev && typeof mode.reduce === 'string' && pr && pr.steps[mode.reduce]) ta.value = pr.steps[mode.reduce].text;
    reduceStart = el('button', {class:'go', type:'button', onclick: () => {
      if(!words(ta.value)){ say('Сначала нужен исходный текст.', 3000); ta.focus(); return; }
      orig = ta.value; reduceStart.remove();
      gauge.before(el('details', {class:'orig'}, el('summary', {class:'mono'}, 'Исходник · ' + words(orig) + ' ' + plural(words(orig),'слово','слова','слов')), el('div', {}, orig)));
      drawGauge(); say('Убирайте лишнее. Цель — половина.', 4000); ta.focus(); if(!everStarted) startTime();
    }}, 'Начать сокращение');
    extras.push(gauge);
  }

  ta.addEventListener('input', () => { if(!everStarted) startTime(); drawSeeds(); drawGauge(); });

  const oracle = el('p', {class:'oracle', hidden:true});
  const stuck = el('button', {class:'quiet', type:'button', onclick: () => {
    let card; do { card = DECK[Math.floor(Math.random()*DECK.length)]; } while(DECK.length > 1 && card === oracle.textContent);
    oracle.hidden = true; void oracle.offsetWidth; oracle.textContent = card; oracle.hidden = false; stuck.textContent = 'Другая карта';
  }}, 'Застряли?');

  const saveBtn = el('button', {class:'go', type:'button', onclick: finish}, mode.release ? 'Отпустить' : 'Сохранить');
  function finish(){
    let text = ta.value.trim();
    if(!text){ say('Напишите хотя бы строку.', 3000); ta.focus(); return; }
    if(orig != null) text += '\n\n[было ' + words(orig) + ' ' + plural(words(orig),'слово','слова','слов') + ', стало ' + words(ta.value) + ']';
    const date = new Date().toISOString();
    if(isStep){
      pr.steps[item.id] = {text, date};
      state.entries.unshift({practice:item.id, title:'«' + pr.name + '»: ' + item.title, text, date});
    } else {
      state.entries.unshift({practice:item.id, title:item.title, text, date});
    }
    save(); freshAt = Date.now();
    if(mode.release) release(); else doneScreen(item, isStep);
  }
  function release(){
    clearInterval(timerId);
    const out = el('div', {class:'release', 'aria-live':'polite'});
    const parts = ta.value.split(/(\s+)/).map(w => el('span', {}, w));
    out.append(...parts);
    ta.replaceWith(out); saveBtn.disabled = true;
    say('Работа больше не только ваша.');
    if(reduceMotion()){ setTimeout(() => doneScreen(item, isStep), 1600); return; }
    requestAnimationFrame(() => requestAnimationFrame(() => {
      parts.forEach((s, i) => {
        s.style.transitionDelay = Math.min(i*12, 900) + 'ms';
        s.style.transform = 'translate(' + (Math.random()*60-30) + 'px,' + (-60 - Math.random()*140) + 'px)';
        s.style.opacity = '0';
      });
    }));
    setTimeout(() => { if(out.isConnected) doneScreen(item, isStep); }, 3800);
  }

  const ctx = isStep ? item.ctx.filter(c => pr.steps[c]).map(c => {
    const src = PROJECT_STEPS.find(x => x.id === c);
    return el('div', {class:'ctx'}, el('p', {class:'label'}, 'Вы писали: ' + src.title), el('blockquote', {}, pr.steps[c].text));
  }) : [];

  const list = isStep ? PROJECT_STEPS : PRACTICES;
  const idx = list.indexOf(item), sib = list.filter(x => x.mod === item.mod);
  const stageNo = MODULES.indexOf(m) + 1;
  const prevItem = list[idx-1], nextItem = list[idx+1];
  const canOpen = x => !isStep || pr.steps[x.id] || x === PROJECT_STEPS.find(s => !pr.steps[s.id]);
  const breath = !prev ? el('button', {class:'link', type:'button', onclick: () => breathe(item.id)}, 'Сначала три вдоха, 30 секунд') : null;

  show(
    el('div', {class:'crumbs'},
      el('button', {class:'quiet', type:'button', onclick: () => go(isStep ? 'project' : 'path')}, '← ' + (isStep ? 'Проект' : 'Этапы')),
      el('span', {class:'mono faint'}, 'Этап ' + stageNo + ' из 5 · ' + plain(m.title) + ' · ' + (isStep ? 'шаг ' + (idx+1) + ' из ' + list.length : 'практика ' + (sib.indexOf(item)+1) + ' из ' + sib.length))),
    el('div', {style:'--sc:' + sc},
      el('div', {class:'row', style:'margin-top:24px;gap:16px'}, mark(item.mod, 30, true), el('p', {class:'label'}, (isStep ? pr.name + ' · ' : '') + item.min + ' мин')),
      el('h1', {}, item.title),
      breath ? el('p', {class:'soft'}, 'Не спешите начинать. ', breath, ' помогут переключиться.') : null,
      el('section', {class:'sec'}, el('p', {class:'label'}, '1 · Задание'),
        el('p', {}, isStep ? item.text : item.desc),
        item.steps ? el('ol', {class:'steps'}, item.steps.map(x => el('li', {}, el('span', {}, x)))) : null,
        ...ctx),
      el('section', {class:'sec'}, el('p', {class:'label'}, '2 · Время'),
        el('div', {class:'timebar'}, el('div', {class:'row'}, digits, timeLabel), timeBtn),
        el('div', {class:'timeline'}, fill)),
      el('section', {class:'sec'}, el('p', {class:'label'}, '3 · Ответ'),
        el('p', {class:'prompt', style:'margin-top:0'}, item.prompt),
        ...extras, ta, hint,
        el('div', {class:'actions'}, reduceStart || saveBtn, reduceStart ? saveBtn : null, freeToggle, stuck),
        oracle),
      el('div', {class:'pager'},
        prevItem && canOpen(prevItem) ? el('button', {class:'quiet', type:'button', onclick: () => openSession(prevItem.id)}, '← ' + prevItem.title) : el('span'),
        nextItem && canOpen(nextItem) ? el('button', {class:'quiet', type:'button', onclick: () => openSession(nextItem.id)}, nextItem.title + ' →') : el('span'))));
  if(reduceStart) saveBtn.classList.replace('go', 'quiet');
  drawSeeds(); lastK = lines(ta.value);
  if(mode.free) say('Здесь стирать нельзя: пишите всё подряд, отбор будет позже.', 6000);
  if(mode.reduce) say('Вставьте или напишите исходный текст, затем начните сокращение.');
}

      : el('p', {class:'block'}, isStep ? 'Проект прошёл все пять этапов. Работа готова к тому, чтобы её увидели.' : 'Все практики пройдены. Повторяйте любые: они работают и во второй раз.'),
    el('div', {class:'row', style:'margin-top:44px;gap:28px'},
      el('button', {class:'link', type:'button', onclick: () => go(isStep ? 'project' : 'path')}, isStep ? 'К проекту' : 'К этапам'),
      el('button', {class:'link', type:'button', onclick: () => go('journal')}, 'Дневник'),
      el('button', {class:'link', type:'button', onclick: () => go('journal')}, 'Поле')));
  drawField(plantCanvas, el('p'));
}



// ---------- Проект: одна работа через все этапы, в фокусе следующий шаг ----------
function viewProject(){
  const pr = state.project;
  if(!pr){
    const input = el('input', {type:'text', class:'line', id:'pname', placeholder:'Название вашей работы', 'aria-label':'Название вашей работы'});
    const start = () => { const name = input.value.trim(); if(!name){ input.focus(); return; } state.project = {name, steps:{}}; save(); viewProject(); };
    input.addEventListener('keydown', e => { if(e.key === 'Enter') start(); });
    show(el('p', {class:'label'}, 'Проект'), el('h1', {}, 'Одна работа, пять этапов'),
      el('p', {class:'soft'}, 'Возьмите что-то своё: рассказ, песню, речь, продукт. За десять шагов вы проведёте это от первых наблюдений до показа. Каждый шаг — отдельный цикл и опирается на то, что вы написали раньше.'),
      input, el('button', {class:'go', type:'button', onclick: start}, 'Начать'));
    return;
  }
  const done = PROJECT_STEPS.filter(st => pr.steps[st.id]).length, next = projectNext();
  show(
    el('p', {class:'label'}, 'Проект · шаг ' + Math.min(done+1, PROJECT_STEPS.length) + ' из ' + PROJECT_STEPS.length),
    el('h1', {}, pr.name),
    el('div', {class:'path', 'aria-label': done + ' из ' + PROJECT_STEPS.length + ' шагов'}, PROJECT_STEPS.map(st =>
      el('span', {class:'dot' + (pr.steps[st.id] ? '' : ' empty') + (st === next ? ' next' : ''), style:'--sc:' + stageColor(st.mod)}))),
    next ? el('div', {class:'row', style:'margin-top:26px'}, el('button', {class:'go', type:'button', onclick: () => openSession(next.id)}, 'Продолжить'),
      el('span', {class:'mono faint'}, 'шаг ' + (done+1) + ': ' + next.title))
      : el('p', {class:'soft', style:'margin-top:26px'}, 'Работа прошла весь путь. Теперь она принадлежит не только вам.'),
    ...MODULES.map(m => el('section', {class:'stage' + (next && next.mod !== m.id ? ' dim' : ''), style:'--sc:' + stageColor(m.id)}, stageHead(m),
      el('ul', {class:'rows' + (next ? ' dimmable' : '')}, PROJECT_STEPS.filter(st => st.mod === m.id).map(st => {
        const d = pr.steps[st.id], open = d || st === next;
        return el('li', {class: (d ? 'is-done' : '') + (st === next ? ' focus' : '')}, el('button', {type:'button', disabled: !open, onclick: () => openSession(st.id)},
          el('span', {class:'num'}, String(PROJECT_STEPS.indexOf(st)+1)),
          el('span', {class:'tw'}, el('span', {class:'t'}, st.title), el('span', {class:'d'}, st.text)),
          el('span', {class:'m' + (st === next ? ' next' : '')}, d ? 'сделано' : st === next ? 'дальше' : st.min + ' мин')));
      })))),
    el('p', {style:'margin-top:56px'}, armBtn(next ? 'Начать заново' : 'Начать новый проект', 'Нажмите ещё раз, чтобы сбросить', () => { state.project = null; save(); viewProject(); })));
}

function viewQuiz(){
  let i = 0, score = 0;
  function render(){
    if(i >= QUIZ.length){
      state.quiz.last = score; state.quiz.best = Math.max(state.quiz.best, score); save(); renderNav();
      show(el('p', {class:'label'}, 'Вопросы'), el('h1', {}, score + ' из ' + QUIZ.length),
        el('p', {class:'soft'}, score >= 6 ? 'Вы хорошо чувствуете эти идеи. Теперь их стоит прожить в практике.' : 'Эти идеи лучше понимаются руками, чем головой. Попробуйте практики и вернитесь.'),
        el('div', {class:'row'}, el('button', {class:'go', type:'button', onclick: viewQuiz}, 'Ещё раз'),
          el('button', {class:'link', type:'button', onclick: () => go('path')}, 'К практикам')));
      return;
    }
    const q = QUIZ[i];
    const note = el('p', {class:'oracle', hidden:true});
    const next = el('button', {class:'go', type:'button', hidden:true, onclick: () => { i++; render(); }}, i === QUIZ.length-1 ? 'Итог' : 'Дальше');
    const btns = q.o.map((t, k) => el('button', {type:'button', onclick: () => {
      btns.forEach((b, j) => { b.disabled = true; if(j === q.a) b.classList.add('right'); });
      if(k === q.a) score++; else btns[k].classList.add('wrong');
      note.textContent = q.e; note.hidden = false; next.hidden = false; next.focus();
    }}, el('span', {class:'k'}, String.fromCharCode(1072 + k)), el('span', {}, t)));
    show(el('p', {class:'label'}, 'Вопрос ' + (i+1) + ' из ' + QUIZ.length),
      el('h2', {style:'margin-top:12px'}, q.q),
      el('ul', {class:'opts'}, btns.map(b => el('li', {}, b))), note,
      el('p', {style:'margin-top:24px'}, next));
  }
  render();
}

function viewJournal(){
  const n = state.entries.length;
  const canvas = el('canvas', {class:'field', role:'img', 'aria-label': n ? 'Поле из ' + n + ' растений, по одному за каждую практику' : 'Пустое поле с одним семенем'});
  const caption = el('p', {class:'caption mono'}, n ? 'Нажмите на растение, чтобы вспомнить, откуда оно.' : '');
  const exp = el('button', {class:'quiet', type:'button', onclick: () => {
    const json = JSON.stringify(state.entries, null, 2);
    const ok = () => { exp.textContent = 'Скопировано'; setTimeout(() => exp.textContent = 'Копировать как JSON', 2000); };
    (navigator.clipboard ? navigator.clipboard.writeText(json) : Promise.reject()).then(ok).catch(() => {
      const ta = el('textarea', {class:'page line', id:'export'}); ta.value = json; exp.replaceWith(ta); ta.select();
    });
  }}, 'Копировать как JSON');
  show(
    el('p', {class:'label'}, 'Поле и дневник'),
    el('h1', {}, n ? 'Что выросло' : 'Пока пусто'),
    el('p', {class:'soft'}, n
      ? n + ' ' + plural(n,'посадка','посадки','посадок') + '. Каждая сохранённая практика сажает семя. Цвет растения — цвет этапа.'
      : 'Каждая сохранённая практика посадит здесь семя, и из ничего постепенно вырастет поле.'),
    canvas, caption,
    el('p', {class:'mono faint', style:'margin:4px 0 0'}, 'Семена прорастают не сразу: сегодня росток, через день побег, через три дня крепкий стебель, через неделю цветок.'),
    n ? el('div', {class:'block'},
      el('div', {class:'row', style:'justify-content:space-between'}, el('p', {class:'label'}, 'Дневник'), exp),
      el('div', {class:'dimmable', style:'margin-top:12px;border-top:1px solid var(--hair)'}, state.entries.map((e, idx) => {
        const it = findItem(e.practice);
        return el('article', {class:'entry' + (idx === 0 ? ' focus' : ''), style: it ? '--sc:' + stageColor(it.mod) : null},
          el('div', {class:'row', style:'justify-content:space-between'},
            el('span', {class:'row', style:'gap:10px'}, el('span', {class:'dot'}),
              el('span', {class:'mono faint'}, new Date(e.date).toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'}) + ' · ' + GROWTH[growthOf(e.date)])),
            armBtn('Удалить', 'Точно?', () => { state.entries.splice(idx,1); save(); viewJournal(); })),
          el('h3', {}, e.title), el('div', {class:'txt'}, e.text));
      })))
      : el('div', {class:'block'}, el('button', {class:'go', type:'button', onclick: () => go('path')}, 'Начать цикл')));
  drawField(canvas, caption);
}

go('path');
</script>
