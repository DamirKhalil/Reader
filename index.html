<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр творческого акта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500&family=Instrument+Serif&display=swap">
<style>
/* Концепция: студийная тишина. Много воздуха, крупный сериф, чёрные кнопки;
   цвет живёт только в иллюстрациях пяти этапов. */
:root{--bg:#f5f6f4;--card:#ffffff;--ink:#101210;--muted:#5f645d;--line:#dcdfda;--tint:#eceee9;--ok:#1f7a4f;--warn:#b4411f;
 --c1:#2b6f90;--c2:#5f8a2c;--c3:#d08216;--c4:#6c4fb8;--c5:#c4392f;
 --serif:"Instrument Serif",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f0d;--card:#161916;--ink:#f1f2ee;--muted:#9ea49b;--line:#272b26;--tint:#1d201c;--ok:#62c795;--warn:#f0906a;--c1:#5fb0d6;--c2:#9bc45f;--c3:#f0b247;--c4:#a58cf0;--c5:#f27a70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f0d;--card:#161916;--ink:#f1f2ee;--muted:#9ea49b;--line:#272b26;--tint:#1d201c;--ok:#62c795;--warn:#f0906a;--c1:#5fb0d6;--c2:#9bc45f;--c3:#f0b247;--c4:#a58cf0;--c5:#f27a70;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans)}
.wrap{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:0 72px;min-width:0}
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font:400 1.35rem/1 var(--serif);letter-spacing:.01em}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{font:500 .9rem var(--sans);background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px;color:var(--muted);cursor:pointer}
nav button[aria-current=true]{color:var(--ink);border-bottom-color:var(--ink)}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;text-wrap:balance}
.eyebrow{font:500 .75rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:40px 24px}
.hero h1{font-size:clamp(2.4rem,7vw,4.2rem);line-height:1.02;margin:12px 0 16px;letter-spacing:-.01em}
.hero p.lead{color:var(--muted);margin:0 0 22px;max-width:46ch}
.hero canvas{width:100%;height:240px;display:block;border-radius:16px;background:var(--tint)}
@media (max-width:640px){.hero{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font:500 .75rem var(--sans);border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);white-space:nowrap}
.pill.done{color:var(--ok);border-color:var(--ok)}
.pill.now{color:var(--ink);border-color:var(--ink)}
.muted{color:var(--muted)}
button.primary,button.ghost{font:500 .95rem var(--sans);border-radius:999px;padding:10px 20px;cursor:pointer}
button.primary{background:var(--ink);color:var(--bg);border:1px solid var(--ink)}
button.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
button.ghost:hover{border-color:var(--ink)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,textarea:focus-visible,input:focus-visible,.item:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ico{display:inline-flex;flex:none;width:var(--s,56px);height:var(--s,56px);color:var(--sc,var(--ink));background:color-mix(in srgb,var(--sc,var(--ink)) 12%,var(--card));border-radius:14px;padding:calc(var(--s,56px)*.12)}
.ico svg{width:100%;height:100%;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.item{cursor:pointer;display:flex;gap:14px;align-items:flex-start;transition:border-color .15s}
.item:hover{border-color:var(--ink)}
.item .body{min-width:0;flex:1}
.item h3{font-size:1.3rem;line-height:1.2}
.item p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.locked{opacity:.45;cursor:default}
.locked:hover{border-color:var(--line)}
.mod{margin-top:44px}
.mod-head{display:flex;gap:16px;align-items:center}
.mod-head h2{font-size:clamp(1.9rem,5vw,2.6rem);line-height:1}
.mod-head p{margin:4px 0 0;color:var(--muted);max-width:52ch}
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:8px}
@media (max-width:640px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}}
.map .cell{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.map .cell:hover{border-color:var(--ink)}
.map h3{font-size:1.25rem}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--sc,var(--ink))}
.sect{font:400 1.7rem/1.1 var(--serif);margin:36px 0 0}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:28px}
.stats b{display:block;font:400 2.6rem/1 var(--serif)}
.stats span{font-size:.85rem;color:var(--muted)}
.timer{font:400 3rem/1 var(--mono);letter-spacing:.02em;font-variant-numeric:tabular-nums}
ol.steps{padding-left:20px;margin:12px 0 0}
ol.steps li{margin:6px 0}
.detail-head{display:flex;gap:16px;align-items:center;margin:20px 0 4px}
.detail-head h2{font-size:clamp(2rem,6vw,3rem);line-height:1}
textarea,input[type=text]{width:100%;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:170px;resize:vertical}
.opt{display:block;width:100%;text-align:left;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.wrong{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--card))}
.entry blockquote{margin:8px 0 0;white-space:pre-wrap;border-left:2px solid var(--line);padding-left:14px;overflow-wrap:anywhere}
.path{display:flex;gap:6px;margin-top:16px}
.path i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.path i.on{background:var(--sc)}
footer{margin-top:56px;color:var(--muted);font-size:.8rem;max-width:62ch}
</style>
</head>
<body>
<div class="bar-top"><div class="bar-in"><div class="brand">Из ничего · тренажёр</div><nav id="nav"></nav></div></div>
<div class="wrap"><main id="view"></main>
<footer>Независимый учебный проект по мотивам идей книги Рика Рубина «Из ничего. Искусство создавать искусство». Он не связан с автором и издателем. Упражнения написаны своими словами, текст книги не воспроизводится. Данные хранятся только в вашем браузере.</footer></div>

<script>
// ---------- Данные ----------
const MODULES = [
  {id:'attention', title:'1. Внимание', idea:'Творчество начинается с того, что вы замечаете. Сначала настраиваем восприятие.'},
  {id:'seed', title:'2. Семя', idea:'Идеи приходят сами. Задача — собирать их и не судить слишком рано.'},
  {id:'experiment', title:'3. Эксперимент', idea:'Играйте, ломайте, пробуйте. Результат пока не важен, важен процесс.'},
  {id:'craft', title:'4. Ремесло', idea:'Идея становится работой через выбор, сокращение и точность.'},
  {id:'completion', title:'5. Завершение', idea:'Закончить — тоже навык: решить, что работа достаточна, и отпустить её.'}
];

const PRACTICES = [
  {id:'a1', mod:'attention', title:'Пять минут тишины', min:5,
   desc:'Сядьте без телефона и музыки. Ваша единственная задача — замечать.',
   steps:['Запустите таймер и сидите спокойно.','Мысленно отмечайте звуки, ощущения, мысли.','После таймера запишите не меньше 10 наблюдений.'],
   prompt:'Что вы заметили? Перечислите наблюдения.'},
  {id:'a2', mod:'attention', title:'Одно место, три взгляда', min:8,
   desc:'Одна и та же комната выглядит по-разному для разных людей.',
   steps:['Выберите место рядом с вами.','Опишите его глазами человека, который видит его впервые.','Опишите глазами того, кто здесь живёт десять лет.','Опишите глазами ребёнка или животного.'],
   prompt:'Три коротких описания одного места.'},
  {id:'a3', mod:'attention', title:'Ритуал начала', min:5,
   desc:'Повторяемое начало помогает перейти из обычного состояния в рабочее.',
   steps:['Придумайте маленькое действие: чай, прогулка, чистый стол, одна и та же песня.','Опишите, как оно будет выглядеть, во сколько и сколько займёт.','Выполните его прямо сейчас и отметьте, что изменилось.'],
   prompt:'Ваш ритуал и что вы почувствовали после него.'},
  {id:'s1', mod:'seed', title:'Десять семян без оценки', min:5,
   desc:'Критик убивает идеи в момент рождения. Дадим им шанс появиться.',
   steps:['Выберите любую область: рассказ, песня, продукт, картина.','За 5 минут запишите 10 идей, даже слабых и странных.','Не вычёркивайте и не оценивайте, пока идёт таймер.'],
   prompt:'Ваш список из 10 идей.'},
  {id:'s2', mod:'seed', title:'Коллекция притяжений', min:6,
   desc:'Вкус — это то, к чему вас тянет. Объяснять причины необязательно.',
   steps:['Назовите 5 вещей, которые вас недавно зацепили: фраза, цвет, звук, кадр.','Не ищите логику, просто запишите.','Затем найдите, что у них общего.'],
   prompt:'Пять вещей и то общее, что вы нашли.'},
  {id:'s3', mod:'seed', title:'Письмо из будущего', min:7,
   desc:'Иногда семя проявляется, когда вы представляете готовое.',
   steps:['Представьте, что ваша работа уже существует и вы её показываете другу.','Опишите её так, как будто она готова: что вы чувствуете, глядя на неё.','Выделите одну деталь, которая вас удивила.'],
   prompt:'Описание «готовой» работы.'},
  {id:'e1', mod:'experiment', title:'Жёсткое ограничение', min:10,
   desc:'Рамки освобождают: меньше вариантов — больше изобретательности.',
   steps:['Выберите небольшую задачу: абзац текста, мелодия из 4 нот, эскиз.','Добавьте строгое правило: только 3 цвета, 50 слов, одна нота в такте.','Сделайте работу в этих рамках.'],
   prompt:'Какое ограничение вы выбрали и что получилось?'},
  {id:'e2', mod:'experiment', title:'Грубый набросок', min:3,
   desc:'Первая версия нужна, чтобы существовать, а не чтобы быть хорошей.',
   steps:['Возьмите идею из практики «Десять семян».','За 3 минуты сделайте самую грубую версию.','Не исправляйте. Остановитесь, когда зазвенит таймер.'],
   prompt:'Что вы сделали? Что показало вам это быстрое действие?'},
  {id:'e3', mod:'experiment', title:'Сделать наоборот', min:6,
   desc:'Переворот привычного часто открывает новое.',
   steps:['Запишите свою текущую идею или работу в одном предложении.','Сформулируйте её полную противоположность.','Сделайте набросок противоположной версии.','Заберите из неё то, что оживляет оригинал.'],
   prompt:'Исходная идея, противоположность и что из неё стоит взять.'},
  {id:'c1', mod:'craft', title:'Сократить вдвое', min:10,
   desc:'Часто сила работы в том, что в ней нет лишнего.',
   steps:['Возьмите свой текст, набросок или план.','Удалите ровно половину, оставьте самое живое.','Сравните: что стало яснее?'],
   prompt:'Что вы убрали и что вы поняли о ядре своей работы?'},
  {id:'c2', mod:'craft', title:'Свежие глаза', min:5,
   desc:'После перерыва вы видите работу почти как чужую.',
   steps:['Отложите работу минимум на день (сегодня — хотя бы на час).','Вернитесь и прочитайте или посмотрите её как зритель.','Отметьте 3 места, где ваше внимание проваливается.'],
   prompt:'Три слабых места и как вы их исправите.'},
  {id:'c3', mod:'craft', title:'Один вопрос', min:5,
   desc:'У сильной работы есть центр. Всё остальное его обслуживает.',
   steps:['Сформулируйте вопрос, на который отвечает ваша работа.','Пройдите по частям и проверьте, служит ли каждая этому вопросу.','Отметьте то, что не служит.'],
   prompt:'Ваш центральный вопрос и список лишнего.'},
  {id:'f1', mod:'completion', title:'Критерий «достаточно»', min:5,
   desc:'Без заранее выбранного финиша работа не заканчивается.',
   steps:['Опишите 3 признака, по которым вы поймёте, что работа готова.','Проверьте свою текущую работу по ним.','Если два из трёх выполнены — объявите её завершённой.'],
   prompt:'Три критерия и результат проверки.'},
  {id:'f2', mod:'completion', title:'Отпустить', min:5,
   desc:'Законченная работа принадлежит миру, а не вам одному.',
   steps:['Выберите, кому вы покажете работу и когда.','Напишите, чего вы боитесь.','Напишите, что получите, если покажете.','Назначьте дату показа.'],
   prompt:'Кому, когда и чего вы боитесь.'}
];


// Сквозной проект: один замысел проходит все этапы, каждый шаг опирается на предыдущие
const PROJECT_STEPS = [
  {id:'p1', mod:'attention', title:'Чем вы заняты', min:3, ctx:[],
   text:'Выберите, над чем будете работать: рассказ, песня, дизайн, проект, речь. Это может быть что угодно. Напишите одной строкой, что это.',
   prompt:'Рабочее название и форма работы.'},
  {id:'p2', mod:'attention', title:'Наблюдения', min:5, ctx:['p1'],
   text:'Посидите с темой в тишине. Не придумывайте, только замечайте: образы, фразы, ощущения, воспоминания, связанные с ней.',
   prompt:'Минимум 10 наблюдений.'},
  {id:'p3', mod:'seed', title:'Семена', min:5, ctx:['p2'],
   text:'Опираясь на наблюдения, запишите как можно больше направлений, в которые работа могла бы пойти. Не оценивайте.',
   prompt:'10 и больше вариантов.'},
  {id:'p4', mod:'seed', title:'Выбор семени', min:5, ctx:['p3'],
   text:'Не выбирайте самое разумное. Выберите то, что тянет сильнее остальных, даже если не можете объяснить почему.',
   prompt:'Выбранное семя и что вас в нём притягивает.'},
  {id:'p5', mod:'experiment', title:'Грубая версия', min:10, ctx:['p4'],
   text:'Сделайте самую быструю и неряшливую версию. Её цель — существовать. Исправлять будете позже.',
   prompt:'Вставьте черновик или опишите, что вы сделали.'},
  {id:'p6', mod:'experiment', title:'Эксперимент', min:10, ctx:['p5'],
   text:'Возьмите черновик и сделайте с ним что-то неожиданное: поменяйте форму, наложите жёсткое ограничение или переверните идею наоборот.',
   prompt:'Что вы изменили и что в новой версии оказалось живее?'},
  {id:'p7', mod:'craft', title:'Центр работы', min:5, ctx:['p4','p6'],
   text:'Найдите вопрос или чувство, вокруг которого всё держится. Проверьте, что служит этому центру, а что отвлекает.',
   prompt:'Центральный вопрос и список лишнего.'},
  {id:'p8', mod:'craft', title:'Сокращение', min:10, ctx:['p7'],
   text:'Уберите лишнее, найденное на предыдущем шаге. Если сомневаетесь, убирайте больше. Работа должна стать яснее.',
   prompt:'Новая версия работы и что вы убрали.'},
  {id:'p9', mod:'completion', title:'Критерий «достаточно»', min:5, ctx:['p7','p8'],
   text:'Определите три признака того, что работа готова, и проверьте по ним текущую версию.',
   prompt:'Три признака и результат проверки.'},
  {id:'p10', mod:'completion', title:'Отпустить', min:5, ctx:['p1','p9'],
   text:'Назначьте, кому и когда вы покажете работу. Напишите, чего вы боитесь и что получите, если покажете.',
   prompt:'Кому, когда, страхи и ожидания.'}
];

const QUIZ = [
  {q:'Вы застряли и не можете начать. Что ближе всего к подходу книги?', o:['Дождаться вдохновения','Снизить ставки: сделать грубый набросок и посмотреть, что получится','Сначала прочитать ещё три книги'], a:1, e:'Эксперимент и маленькие шаги снимают давление. Первая версия не обязана быть хорошей.'},
  {q:'Что делать с «плохими» идеями на стадии семян?', o:['Сразу отбрасывать','Собирать без оценки: судить рано','Показывать всем для обратной связи'], a:1, e:'На ранней стадии критик мешает. Отбор лучше отложить на потом.'},
  {q:'Зачем нужны жёсткие ограничения?', o:['Чтобы усложнить жизнь','Чтобы сузить выбор и подтолкнуть изобретательность','Чтобы заставить работать быстрее'], a:1, e:'Рамки дают опору, а чистый лист без правил нередко парализует.'},
  {q:'Что такое «вкус» в творческом процессе?', o:['Набор правил хорошего тона','То, к чему вас искренне тянет и что вы можете развивать','Мнение критиков'], a:1, e:'Вкус тренируется вниманием и коллекционированием того, что вас зацепило.'},
  {q:'Как лучше проверять работу на последних этапах?', o:['Править без остановки','Дать себе перерыв и посмотреть свежим взглядом','Спросить как можно больше людей'], a:1, e:'Дистанция даёт взгляд зрителя, и слабые места становятся заметнее.'},
  {q:'Почему важно завершать работы?', o:['Чтобы освободить место для следующих и выпустить их в мир','Чтобы похвастаться','Потому что так принято'], a:0, e:'Бесконечная доработка тоже способ защититься от показа. Законченное двигает вас дальше.'},
  {q:'Что лучше всего описывает ритуал начала?', o:['Суеверие','Повторяемое действие, настраивающее на работу','Способ потянуть время'], a:1, e:'Ритуал сигнализирует мозгу, что пора переходить в творческое состояние.'},
  {q:'Вы сократили текст вдвое и он стал лучше. Что это значит?', o:['Вы испортили оригинал','Ядро работы было сильнее, чем окружающий шум','Нужно сократить ещё в десять раз'], a:1, e:'Вычёркивание проясняет, что в работе действительно живое.'}
];

// ---------- Хранилище ----------
const KEY = 'creative-trainer-v1';
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.entries) return d; }catch(e){}
  return {entries:[], quiz:{best:0, last:0}, project:null};
}
let state = load();
if(!state.project) state.project = null;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const doneIds = () => new Set(state.entries.map(e => e.practice));
const dayKey = d => d.toISOString().slice(0,10);
function streak(){
  const pSteps = state.project ? Object.values(state.project.steps) : [];
  const days = new Set([...state.entries, ...pSteps].map(e => e.date.slice(0,10)));
  let n = 0, d = new Date();
  if(!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  while(days.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}


// ---------- Утилиты DOM ----------
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v == null) continue;
    if(k === 'class') n.className = v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for(const c of kids.flat()) if(c != null && c !== false) n.append(c);
  return n;
}
const view = document.getElementById('view');
function show(...nodes){ view.replaceChildren(...nodes); window.scrollTo(0,0); }

// ---------- Иллюстрации этапов ----------
const ART = {
  attention:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="32" cy="32" r="4" fill="currentColor" stroke="none"/><circle cx="32" cy="32" r="12"/><circle cx="32" cy="32" r="20" opacity=".65"/><circle cx="32" cy="32" r="28" opacity=".35"/></svg>',
  seed:'<svg viewBox="0 0 64 64" fill="currentColor"><circle cx="32" cy="38" r="9"/><circle cx="14" cy="16" r="3.5"/><circle cx="48" cy="12" r="5"/><circle cx="54" cy="34" r="2.5"/><circle cx="12" cy="46" r="2.5"/><circle cx="40" cy="56" r="3"/><circle cx="26" cy="12" r="2"/></svg>',
  experiment:'<svg viewBox="0 0 64 64" fill="currentColor"><circle cx="24" cy="26" r="16" opacity=".55"/><rect x="26" y="22" width="28" height="28" rx="2" opacity=".55"/><path d="M12 54 30 28 48 54Z" opacity=".55"/></svg>',
  craft:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M10 14h44M10 28h30M10 42h44M10 56h18"/><path d="M48 24l-6 8" stroke-width="2.5" opacity=".6"/></svg>',
  completion:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor"><circle cx="32" cy="32" r="22" stroke-width="6"/><circle cx="32" cy="32" r="6" fill="currentColor" stroke="none"/></svg>'
};
const STAGE_VAR = {attention:'--c1', seed:'--c2', experiment:'--c3', craft:'--c4', completion:'--c5'};
const stageColor = m => 'var(' + STAGE_VAR[m] + ')';
function icon(mod, px){
  const s = el('span', {class:'ico', style:'--sc:' + stageColor(mod) + ';--s:' + (px||56) + 'px'});
  s.innerHTML = ART[mod]; return s;
}
const plain = t => t.replace(/^\d+\.\s*/, '');

// ---------- Навигация ----------
const TABS = [['today','Сегодня'],['project','Проект'],['practices','Практики'],['quiz','Тест'],['journal','Дневник']];
let currentTab = 'today', timerId = null;
function renderNav(){
  document.getElementById('nav').replaceChildren(...TABS.map(([id,label]) =>
    el('button', {'aria-current': String(id === currentTab), onclick: () => go(id)}, label)));
}
function go(tab){
  clearInterval(timerId);
  currentTab = tab; renderNav();
  ({today:viewToday, project:viewProject, practices:viewPractices, quiz:viewQuiz, journal:viewJournal})[tab]();
}

function armBtn(label, armedLabel, fn){
  let t = null;
  const b = el('button', {class:'ghost', onclick: () => {
    if(t){ clearTimeout(t); fn(); return; }
    b.textContent = armedLabel; t = setTimeout(() => { t = null; b.textContent = label; }, 3000);
  }}, label);
  return b;
}

function makeTimer(minutes){
  let left = minutes * 60, running = false;
  const fmt = n => String(Math.floor(n/60)).padStart(2,'0') + ':' + String(n%60).padStart(2,'0');
  const display = el('div', {class:'timer'}, fmt(left));
  const btn = el('button', {class:'primary', onclick: () => {
    if(running){ clearInterval(timerId); running = false; btn.textContent = 'Продолжить'; return; }
    running = true; btn.textContent = 'Пауза';
    timerId = setInterval(() => {
      left--; display.textContent = fmt(Math.max(left,0));
      if(left <= 0){ clearInterval(timerId); running = false; btn.textContent = 'Время вышло'; btn.disabled = true; }
    }, 1000);
  }}, 'Старт');
  return el('div', {class:'card row', style:'justify-content:space-between'}, display, btn);
}

// ---------- Волна в шапке ----------
function drawWaves(canvas){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ctx = canvas.getContext('2d');
  let t = 0;
  function frame(){
    if(!canvas.isConnected) return;
    const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
    if(canvas.width !== w*dpr){ canvas.width = w*dpr; canvas.height = h*dpr; }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    const cs = getComputedStyle(canvas);
    ['--c1','--c2','--c3','--c4','--c5'].forEach((v,i) => {
      ctx.beginPath(); ctx.lineWidth = 2; ctx.strokeStyle = cs.getPropertyValue(v).trim();
      ctx.globalAlpha = .9;
      for(let x=0; x<=w; x+=4){
        const k = x / w;
        const env = Math.sin(Math.PI * k);
        const y = h/2 + env * (h*.34) * Math.sin(k*(4+i*1.3) + t*(.6+i*.18) + i*1.1) * (1 - i*.12);
        x ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
      }
      ctx.stroke();
    });
    t += .02;
    if(!reduce) requestAnimationFrame(frame);
  }
  frame();
}

// ---------- Экраны ----------
function practiceCard(p){
  const done = doneIds().has(p.id);
  return el('div', {class:'card item', tabindex:'0', role:'button', onclick: () => openPractice(p.id),
      onkeydown: e => { if(e.key === 'Enter') openPractice(p.id); }},
    icon(p.mod, 52),
    el('div', {class:'body'},
      el('div', {class:'row'}, el('h3', {}, p.title), el('span', {class:'pill'}, p.min + ' мин'), done ? el('span', {class:'pill done'}, 'выполнено') : null),
      el('p', {}, p.desc)));
}

function viewToday(){
  const done = doneIds();
  const left = PRACTICES.filter(p => !done.has(p.id));
  const pool = left.length ? left : PRACTICES;
  const pick = pool[Number(dayKey(new Date()).replaceAll('-','')) % pool.length];
  const canvas = el('canvas', {'aria-hidden':'true'});
  const hero = el('section', {class:'hero'},
    el('div', {},
      el('p', {class:'eyebrow'}, 'Практики по книге «Из ничего»'),
      el('h1', {}, 'Творчество начинается с внимания'),
      el('p', {class:'lead'}, 'Пять этапов: от первых наблюдений до законченной работы. Короткие упражнения, таймер и дневник, в котором остаётся весь ваш путь.'),
      el('div', {class:'row'},
        el('button', {class:'primary', onclick: () => openPractice(pick.id)}, 'Практика дня'),
        el('button', {class:'ghost', onclick: () => go('project')}, state.project ? 'Мой проект' : 'Начать проект'))),
    canvas);
  const map = el('div', {class:'map'}, MODULES.map(m => {
    const all = PRACTICES.filter(p => p.mod === m.id), n = all.filter(p => done.has(p.id)).length;
    return el('button', {class:'cell', style:'--sc:' + stageColor(m.id), onclick: () => go('practices')},
      icon(m.id, 44), el('h3', {}, plain(m.title)),
      el('div', {class:'meter'}, el('i', {style:'width:' + Math.round(n/all.length*100) + '%'})),
      el('span', {class:'muted', style:'font-size:.8rem'}, n + ' из ' + all.length));
  }));
  show(hero,
    el('div', {class:'stats'},
      el('div', {}, el('b', {}, done.size + '/' + PRACTICES.length), el('span', {}, 'практик выполнено')),
      el('div', {}, el('b', {}, String(streak())), el('span', {}, 'дней подряд')),
      el('div', {}, el('b', {}, state.quiz.best + '/' + QUIZ.length), el('span', {}, 'лучший результат теста'))),
    el('h2', {class:'sect'}, 'Карта этапов'), map,
    el('h2', {class:'sect'}, 'Практика дня'), el('div', {class:'stack'}, practiceCard(pick)));
  drawWaves(canvas);
}

function modHead(m){
  return el('div', {class:'mod-head'}, icon(m.id, 72), el('div', {}, el('h2', {}, plain(m.title)), el('p', {}, m.idea)));
}

function viewPractices(){
  show(...MODULES.map(m => el('section', {class:'mod', style:'--sc:' + stageColor(m.id)},
    modHead(m), el('div', {class:'stack'}, PRACTICES.filter(p => p.mod === m.id).map(practiceCard)))));
}

function openPractice(id){
  const p = PRACTICES.find(x => x.id === id), m = MODULES.find(x => x.id === p.mod);
  clearInterval(timerId);
  const area = el('textarea', {id:'ans', placeholder:'Пишите здесь…'});
  const finish = el('button', {class:'primary', onclick: () => {
    const text = area.value.trim(); if(!text){ area.focus(); return; }
    state.entries.unshift({practice:p.id, title:p.title, text, date:new Date().toISOString()});
    save(); go('journal');
  }}, 'Сохранить в дневник');
  show(
    el('button', {class:'ghost', onclick: () => go('practices')}, '← Назад'),
    el('div', {class:'detail-head'}, icon(p.mod, 72), el('div', {}, el('p', {class:'eyebrow'}, plain(m.title) + ' · ' + p.min + ' мин'), el('h2', {}, p.title))),
    el('div', {class:'stack'},
      el('div', {class:'card'}, el('p', {class:'muted', style:'margin:0'}, p.desc), el('ol', {class:'steps'}, p.steps.map(s => el('li', {}, s)))),
      makeTimer(p.min),
      el('div', {class:'card'}, el('p', {style:'margin-top:0'}, p.prompt), area, el('p', {style:'margin-bottom:0'}, finish))));
}

function viewProject(){
  const pr = state.project;
  if(!pr){
    const input = el('input', {type:'text', id:'pname', placeholder:'Например: рассказ про деда'});
    show(el('section', {class:'hero', style:'grid-template-columns:minmax(0,1fr)'},
      el('div', {}, el('p', {class:'eyebrow'}, 'Сквозной проект'),
        el('h1', {}, 'Одна работа, пять этапов'),
        el('p', {class:'lead'}, 'Возьмите свою работу и проведите её от наблюдений до показа. Каждый шаг опирается на то, что вы написали раньше.'),
        el('div', {class:'row'}, input, el('button', {class:'primary', onclick: () => {
          const name = input.value.trim(); if(!name){ input.focus(); return; }
          state.project = {name, steps:{}}; save(); viewProject();
        }}, 'Начать проект')))));
    return;
  }
  const done = PROJECT_STEPS.filter(st => pr.steps[st.id]).length;
  const next = PROJECT_STEPS.find(st => !pr.steps[st.id]);
  const path = el('div', {class:'path'}, MODULES.map(m => {
    const sts = PROJECT_STEPS.filter(s => s.mod === m.id);
    return el('i', {class: sts.every(s => pr.steps[s.id]) ? 'on' : '', style:'--sc:' + stageColor(m.id)});
  }));
  const nodes = [
    el('div', {style:'padding-top:36px'}, el('p', {class:'eyebrow'}, 'Проект · ' + done + ' из ' + PROJECT_STEPS.length + ' шагов'),
      el('h1', {style:'font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.05;margin-top:8px'}, pr.name), path)];
  MODULES.forEach(m => nodes.push(el('section', {class:'mod', style:'--sc:' + stageColor(m.id)}, modHead(m),
    el('div', {class:'stack'}, PROJECT_STEPS.filter(st => st.mod === m.id).map(st => {
      const d = pr.steps[st.id], open = d || st === next;
      return el('div', {class:'card item' + (open ? '' : ' locked'), tabindex: open ? '0' : null, onclick: open ? () => openProjectStep(st.id) : null},
        el('div', {class:'body'},
          el('div', {class:'row'}, el('h3', {}, st.title), el('span', {class:'pill'}, st.min + ' мин'),
            d ? el('span', {class:'pill done'}, 'выполнено') : (st === next ? el('span', {class:'pill now'}, 'следующий') : el('span', {class:'pill'}, 'закрыто'))),
          el('p', {}, st.text)));
    })))));
  nodes.push(el('p', {style:'margin-top:40px'}, armBtn('Начать заново', 'Точно сбросить?', () => { state.project = null; save(); viewProject(); })));
  show(...nodes);
}

function openProjectStep(id){
  const st = PROJECT_STEPS.find(x => x.id === id), pr = state.project, m = MODULES.find(x => x.id === st.mod);
  clearInterval(timerId);
  const area = el('textarea', {id:'pans', placeholder:'Пишите здесь…'}); area.value = pr.steps[id] ? pr.steps[id].text : '';
  const ctx = st.ctx.filter(c => pr.steps[c]).map(c => {
    const src = PROJECT_STEPS.find(x => x.id === c);
    return el('div', {class:'card entry'}, el('p', {class:'eyebrow'}, 'Из шага «' + src.title + '»'), el('blockquote', {}, pr.steps[c].text));
  });
  const saveBtn = el('button', {class:'primary', onclick: () => {
    const text = area.value.trim(); if(!text){ area.focus(); return; }
    pr.steps[id] = {text, date:new Date().toISOString()}; save(); go('project');
  }}, 'Сохранить шаг');
  show(
    el('button', {class:'ghost', onclick: () => go('project')}, '← К проекту'),
    el('div', {class:'detail-head'}, icon(st.mod, 72), el('div', {}, el('p', {class:'eyebrow'}, pr.name + ' · ' + plain(m.title)), el('h2', {}, st.title))),
    el('div', {class:'stack'},
      el('div', {class:'card'}, el('p', {style:'margin:0'}, st.text)),
      ...ctx, makeTimer(st.min),
      el('div', {class:'card'}, el('p', {style:'margin-top:0'}, st.prompt), area, el('p', {style:'margin-bottom:0'}, saveBtn))));
}

function viewQuiz(){
  let i = 0, score = 0;
  function render(){
    if(i >= QUIZ.length){
      state.quiz.last = score; state.quiz.best = Math.max(state.quiz.best, score); save();
      show(el('section', {class:'hero', style:'grid-template-columns:minmax(0,1fr)'}, el('div', {},
        el('p', {class:'eyebrow'}, 'Результат'), el('h1', {}, score + ' из ' + QUIZ.length),
        el('p', {class:'lead'}, score >= 6 ? 'Хорошее понимание идей. Закрепите его практикой.' : 'Загляните в практики: эти идеи лучше усваиваются руками.'),
        el('button', {class:'primary', onclick: viewQuiz}, 'Пройти ещё раз'))));
      return;
    }
    const q = QUIZ[i];
    const note = el('p', {class:'muted'});
    const next = el('button', {class:'primary', hidden:'', onclick: () => { i++; render(); }}, i === QUIZ.length-1 ? 'Результат' : 'Дальше');
    const btns = q.o.map((t, k) => el('button', {class:'opt', onclick: () => {
      btns.forEach((b, j) => { b.disabled = true; if(j === q.a) b.classList.add('right'); });
      if(k === q.a) score++; else btns[k].classList.add('wrong');
      note.textContent = q.e; next.hidden = false;
    }}, t));
    show(el('div', {style:'padding-top:36px'}, el('p', {class:'eyebrow'}, 'Вопрос ' + (i+1) + ' из ' + QUIZ.length),
      el('h1', {style:'font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;margin:8px 0 16px'}, q.q), ...btns, note, next));
  }
  render();
}

function viewJournal(){
  if(!state.entries.length){
    show(el('section', {class:'hero', style:'grid-template-columns:minmax(0,1fr)'}, el('div', {},
      el('p', {class:'eyebrow'}, 'Дневник'), el('h1', {}, 'Пока пусто'),
      el('p', {class:'lead'}, 'Здесь появятся ответы из ваших практик. Начните с любой.'),
      el('button', {class:'primary', onclick: () => go('practices')}, 'К практикам'))));
    return;
  }
  const exp = el('button', {class:'ghost', onclick: () => {
    const json = JSON.stringify(state.entries, null, 2);
    const ok = () => { exp.textContent = 'Скопировано'; setTimeout(() => exp.textContent = 'Копировать как JSON', 2000); };
    (navigator.clipboard ? navigator.clipboard.writeText(json) : Promise.reject()).then(ok).catch(() => {
      const ta = el('textarea', {id:'export'}); ta.value = json; exp.replaceWith(ta); ta.select();
    });
  }}, 'Копировать как JSON');
  show(el('div', {style:'padding-top:36px'}, el('h1', {style:'font-size:clamp(2.2rem,6vw,3.4rem)'}, 'Дневник'), el('p', {style:'margin:12px 0 0'}, exp)),
    el('div', {class:'stack'}, state.entries.map((e, idx) => {
      const pr = PRACTICES.find(p => p.id === e.practice);
      return el('div', {class:'card entry'},
        el('div', {class:'row', style:'justify-content:space-between'},
          el('div', {class:'row'}, pr ? icon(pr.mod, 36) : null, el('h3', {style:'font-size:1.3rem'}, e.title)),
          el('div', {class:'row'}, el('span', {class:'pill'}, new Date(e.date).toLocaleDateString('ru-RU')),
            armBtn('Удалить', 'Точно удалить?', () => { state.entries.splice(idx,1); save(); viewJournal(); }))),
        el('blockquote', {}, e.text));
    })));
}

go('today');
</script>
