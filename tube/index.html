<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чернила</title>
<meta name="description" content="Видео о писателях и писательстве: интервью, мастер-классы, разборы.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Концепция: тетрадь, исписанная фиолетовыми школьными чернилами.
   Холодная бумага, один цвет чернил, дидона для заголовков, моно — для пометок на полях. */
:root{
  --paper:#f5f5f1; --sheet:#ffffff; --ink:#17161f; --soft:#55535f; --faint:#8b8996; --rule:#e2e1ea;
  --violet:#4b2fc9; --violet-tint:#ece8fb; --blot:#2a1a7a;
  --t-interview:#4b2fc9; --t-lecture:#0f7a5c; --t-analysis:#b2452c;
  --display:"Prata",Georgia,"Times New Roman",serif;
  --text:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121119; --sheet:#1a1924; --ink:#eceaf4; --soft:#aeabbd; --faint:#76738a; --rule:#2b2938;
  --violet:#a493ff; --violet-tint:#26213f; --blot:#c9bfff;
  --t-interview:#a493ff; --t-lecture:#5fcfa8; --t-analysis:#f08c6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121119; --sheet:#1a1924; --ink:#eceaf4; --soft:#aeabbd; --faint:#76738a; --rule:#2b2938;
  --violet:#a493ff; --violet-tint:#26213f; --blot:#c9bfff;
  --t-interview:#a493ff; --t-lecture:#5fcfa8; --t-analysis:#f08c6f; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
::selection{background:var(--violet);color:var(--sheet)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:4px}
img{max-width:100%}
[hidden]{display:none!important}

.wrap{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* шапка */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:20px;padding-block:14px}
.logo{display:flex;align-items:baseline;gap:10px;text-decoration:none;flex:none}
.logo b{font:400 1.7rem/1 var(--display);letter-spacing:-.01em}
.logo .drop{width:11px;height:14px;background:var(--violet);border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;transform:translateY(1px)}
.search{flex:1;max-width:520px;margin-left:auto;position:relative}
.search input{width:100%;height:42px;border:1px solid var(--rule);background:var(--sheet);border-radius:21px;padding:0 16px 0 40px;outline:none;transition:border-color .15s}
.search input:focus{border-color:var(--violet)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.navlinks{display:flex;gap:4px;flex:none}
.navlinks a{font:500 .9rem var(--text);text-decoration:none;padding:8px 12px;border-radius:8px;color:var(--soft)}
.navlinks a:hover{color:var(--ink);background:var(--violet-tint)}
.navlinks a[aria-current="page"]{color:var(--violet)}
.navlinks .count{font:500 .7rem var(--mono);color:var(--violet);margin-left:4px}
@media (max-width:820px){
  .bar{flex-wrap:wrap;gap:10px 14px}
  .search{order:3;flex-basis:100%;max-width:none}
  .navlinks{margin-left:auto}
  .navlinks a{padding:6px 8px}
}

main{padding-block:28px 96px}
.label{font:400 .72rem/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}

/* вступление */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:end;padding-block:12px 32px;border-bottom:1px solid var(--rule);margin-bottom:24px}
.intro h1{font:400 clamp(2.3rem,5.4vw,4.3rem)/1.02 var(--display);letter-spacing:-.02em;margin:10px 0 0;text-wrap:balance}
.intro h1 em{font-style:normal;color:var(--violet)}
.intro p{margin:0;color:var(--soft);max-width:44ch}
.stats{display:flex;gap:28px;margin-top:18px}
.stats div{display:flex;flex-direction:column}
.stats b{font:400 1.9rem/1 var(--display);font-variant-numeric:tabular-nums}
.stats span{font:400 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:6px}
@media (max-width:820px){.intro{grid-template-columns:minmax(0,1fr);gap:16px}}

/* фильтры */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:26px}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:7px 14px;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--faint)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.filters .sep{width:1px;height:22px;background:var(--rule);margin:0 6px}
@media (max-width:600px){.filters .sep{display:none}}
.filters .lang .chip{padding:7px 11px;font:500 .75rem var(--mono);letter-spacing:.06em}
.lang{display:flex;gap:6px}

/* сетка */
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:40px 0 16px}
.section-h:first-child{margin-top:0}
.section-h h2{font:400 1.7rem/1.1 var(--display);margin:0;letter-spacing:-.01em}
.section-h a{font-size:.9rem;color:var(--violet);text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:30px 22px}
.card{display:flex;flex-direction:column;gap:12px;text-decoration:none;min-width:0}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:var(--violet-tint)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.card:hover .thumb img{transform:scale(1.04)}
.thumb .ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:14px 48px 14px 16px;font:400 1.35rem/1.1 var(--display);color:var(--blot);background:
  radial-gradient(120% 90% at 85% 10%,color-mix(in srgb,var(--violet) 28%,transparent),transparent 60%),var(--violet-tint)}
.thumb .tag{position:absolute;left:10px;top:10px;font:500 .66rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;background:var(--sheet);color:var(--ink);padding:6px 8px;border-radius:6px;display:flex;align-items:center;gap:6px}
.thumb .tag i{width:7px;height:7px;border-radius:50%;display:block}
.thumb .lng{position:absolute;right:10px;bottom:10px;font:500 .66rem/1 var(--mono);background:rgba(0,0,0,.72);color:#fff;padding:5px 7px;border-radius:5px;letter-spacing:.08em}
.save{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--sheet);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .15s;color:var(--ink)}
.card:hover .save,.save[aria-pressed="true"],.save:focus-visible{opacity:1}
.card .save{z-index:2}
.save[aria-pressed="true"]{color:var(--violet)}
@media (hover:none){.save{opacity:1}}
.meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.meta h3{font:500 1rem/1.35 var(--text);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta .who{font-size:.88rem;color:var(--soft)}
.meta .sub{font:400 .74rem var(--mono);color:var(--faint);letter-spacing:.03em}
.empty{padding:56px 0;text-align:center;color:var(--soft)}
.empty b{display:block;font:400 1.5rem var(--display);color:var(--ink);margin-bottom:8px}

/* курсы */
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
.course{display:grid;grid-template-columns:140px minmax(0,1fr);gap:16px;align-items:start;text-decoration:none;padding:14px;border:1px solid var(--rule);border-radius:14px;background:var(--sheet);transition:border-color .15s}
.course:hover{border-color:var(--violet)}
.course .thumb{border-radius:8px}
.course h3{font:400 1.15rem/1.2 var(--display);margin:2px 0 6px}
.course p{margin:0;font-size:.88rem;color:var(--soft)}
@media (max-width:420px){.course{grid-template-columns:minmax(0,1fr)}}

/* просмотр */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px}
@media (max-width:1000px){.watch{grid-template-columns:minmax(0,1fr)}}
.player{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.w-title{font:400 clamp(1.5rem,3vw,2.2rem)/1.15 var(--display);margin:22px 0 10px;letter-spacing:-.01em;text-wrap:balance}
.w-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.w-row .writer{font-weight:600;text-decoration:none;border-bottom:1px solid var(--violet)}
.w-row .writer:hover{color:var(--violet)}
.actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:8px 16px;font-size:.9rem;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--violet);border-color:var(--violet);color:var(--sheet)}
.btn.primary:hover{background:var(--blot);border-color:var(--blot)}
.btn[aria-pressed="true"]{color:var(--violet);border-color:var(--violet)}
.notes{margin-top:18px;padding:18px 20px;border-radius:12px;background:var(--sheet);border:1px solid var(--rule);max-width:70ch}
.notes p{margin:0 0 6px}
.notes .label{margin-bottom:8px;display:block}
.side h2{font:400 1.25rem var(--display);margin:0 0 14px}
.side .list{display:flex;flex-direction:column;gap:14px}
.mini{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;text-decoration:none}
.mini .thumb{border-radius:8px}
.mini .thumb .ph{font-size:.95rem;padding:8px 40px 8px 10px}
.course .thumb .ph{font-size:1rem;padding:8px 40px 8px 10px}
.mini h3{font:500 .9rem/1.3 var(--text);margin:0 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .who{font-size:.8rem;color:var(--soft)}
.mini:hover h3{color:var(--violet)}
.hint{font-size:.85rem;color:var(--faint);margin-top:12px}

/* авторы */
.writers{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.wcard{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--rule);border-radius:14px;background:var(--sheet);text-decoration:none;transition:border-color .15s}
.wcard:hover{border-color:var(--violet)}
.mono-av{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--violet-tint);color:var(--blot);font:400 1.25rem var(--display)}
.wcard b{display:block;font-weight:500;line-height:1.25}
.wcard span{font:400 .72rem var(--mono);color:var(--faint)}
.whead{display:flex;align-items:center;gap:20px;margin-bottom:28px}
.whead .mono-av{width:84px;height:84px;font-size:2rem}
.whead h1{font:400 clamp(2rem,4.4vw,3.2rem)/1.05 var(--display);margin:6px 0 0}

/* форма */
.form{max-width:640px;display:grid;gap:16px;background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:24px}
.form h1{font:400 2rem/1.1 var(--display);margin:0}
.form label{display:grid;gap:6px;font-size:.88rem;color:var(--soft)}
.form input,.form select,.form textarea{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:10px 12px;outline:none;width:100%}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--violet)}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.form .row{grid-template-columns:1fr}}
.msg{font-size:.9rem;min-height:1.4em}
.msg.err{color:var(--t-analysis)}
.msg.ok{color:var(--t-lecture)}
.preview{display:none;grid-template-columns:160px minmax(0,1fr);gap:12px;align-items:center}
.preview.on{display:grid}
pre.export{max-height:220px;overflow:auto;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:12px;font:400 .75rem/1.5 var(--mono);white-space:pre}

footer{border-top:1px solid var(--rule);padding-block:24px 40px;color:var(--faint);font-size:.85rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="logo" href="#"><span class="drop" aria-hidden="true"></span><b>Чернила</b></a>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Писатель, тема или название" autocomplete="off" aria-label="Поиск по видео">
    </label>
    <nav class="navlinks" aria-label="Разделы">
      <a href="#" data-nav="home">Видео</a>
      <a href="#authors" data-nav="authors">Авторы</a>
      <a href="#saved" data-nav="saved">Отложенное<span class="count" id="savedCount"></span></a>
      <a href="#add" data-nav="add">Добавить</a>
    </nav>
  </div>
</header>

<main class="wrap" id="view" tabindex="-1"></main>

<footer>
  <div class="wrap">
    <span>Видео воспроизводятся с YouTube. Права на записи принадлежат их авторам и каналам.</span>
    <span>Чтобы пополнить каталог, допишите строку в <code>catalog.js</code>.</span>
  </div>
</footer>

<script src="catalog.js"></script>
<script>
(() => {
  const TYPES = {
    interview: { name: "Интервью", many: "Интервью", color: "var(--t-interview)" },
    lecture:   { name: "Мастер-класс", many: "Мастер-классы и лекции", color: "var(--t-lecture)" },
    analysis:  { name: "Разбор", many: "Разборы", color: "var(--t-analysis)" }
  };
  const LANGS = { ru: "RU", en: "EN" };

  /* ── хранилище (только этот браузер) ── */
  const store = {
    get(k, d) { try { const v = localStorage.getItem("chernila." + k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("chernila." + k, JSON.stringify(v)); } catch {} }
  };
  let saved = new Set(store.get("saved", []));
  let custom = store.get("custom", []);
  const base = (window.CATALOG && window.CATALOG.VIDEOS) || [];
  const COURSES = (window.CATALOG && window.CATALOG.COURSES) || [];
  const all = () => [...custom.map(v => ({ ...v, custom: true })), ...base];
  const byId = id => all().find(v => v.id === id);

  const state = { type: "all", lang: "all", q: "" };

  /* ── утилиты ── */
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const slug = s => encodeURIComponent(s);
  const initials = name => name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  const norm = s => String(s ?? "").toLowerCase().replace(/ё/g, "е");
  const plural = (n, one, few, many) => {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  };

  function thumb(v, { big = false, cover } = {}) {
    const id = cover !== undefined ? cover : v.id;
    const t = TYPES[v.type];
    const tag = t && big ? `<span class="tag"><i style="background:${t.color}"></i>${t.name}</span>` : "";
    const lang = v.lang ? `<span class="lng">${LANGS[v.lang] || esc(v.lang)}</span>` : "";
    const img = id ? `<img src="https://i.ytimg.com/vi/${esc(id)}/hqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">` : "";
    return `<div class="thumb"><div class="ph">${esc(v.writer)}</div>${img}${tag}${lang}</div>`;
  }
  const saveBtn = id => `<button class="save" type="button" data-save="${esc(id)}" aria-pressed="${saved.has(id)}" aria-label="${saved.has(id) ? "Убрать из отложенного" : "Отложить"}">${bookmark(saved.has(id))}</button>`;
  const bookmark = on => `<svg width="16" height="16" viewBox="0 0 24 24" fill="${on ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>`;
  const subline = v => [v.series, v.year, v.by].filter(Boolean).map(esc).join(" · ");

  function card(v) {
    return `<a class="card" href="#watch-${esc(v.id)}">
      <div style="position:relative">${thumb(v, { big: true })}${saveBtn(v.id)}</div>
      <div class="meta"><h3>${esc(v.title)}</h3><span class="who">${esc(v.writer)}</span>${subline(v) ? `<span class="sub">${subline(v)}</span>` : ""}</div>
    </a>`;
  }
  function courseCard(c) {
    return `<a class="course" href="#course-${esc(c.list)}">${thumb(c, { cover: c.cover || "" })}
      <div><span class="label">Курс · ${esc(c.writer)}</span><h3>${esc(c.title)}</h3><p>${esc(c.note || "")}</p></div></a>`;
  }
  const grid = list => list.length ? `<div class="grid">${list.map(card).join("")}</div>` : "";

  function filtered() {
    const q = norm(state.q).trim();
    return all().filter(v =>
      (state.type === "all" || v.type === state.type) &&
      (state.lang === "all" || v.lang === state.lang) &&
      (!q || norm([v.title, v.writer, v.note, v.series, v.by].join(" ")).includes(q)));
  }

  /* ── экраны ── */
  function home() {
    const list = filtered();
    const writers = new Set(all().map(v => v.writer));
    const chip = (key, val, label, dot) =>
      `<button class="chip" type="button" data-f="${key}" data-v="${val}" aria-pressed="${state[key] === val}">${dot ? `<span class="dot" style="background:${dot}"></span>` : ""}${label}</button>`;
    const filters = `<div class="filters" role="toolbar" aria-label="Фильтры">
        ${chip("type", "all", "Всё")}
        ${Object.entries(TYPES).map(([k, t]) => chip("type", k, t.many, t.color)).join("")}
        <span class="sep" aria-hidden="true"></span>
        <div class="lang">${chip("lang", "all", "ВСЕ ЯЗЫКИ")}${chip("lang", "ru", "RU")}${chip("lang", "en", "EN")}</div>
      </div>`;

    let body;
    const plain = state.type === "all" && state.lang === "all" && !state.q;
    if (!list.length) {
      body = `<div class="empty"><b>Ничего не нашлось</b>Попробуйте другое имя или сбросьте фильтры.<br><br><button class="btn" type="button" data-reset>Сбросить</button></div>`;
    } else if (plain) {
      const sec = (k, n) => {
        const items = list.filter(v => v.type === k);
        return items.length ? `<div class="section-h"><h2>${TYPES[k].many}</h2><a href="#" data-pick="${k}">Все ${items.length} →</a></div>${grid(items.slice(0, n))}` : "";
      };
      body = sec("interview", 8) +
        (COURSES.length ? `<div class="section-h"><h2>Курсы целиком</h2></div><div class="courses">${COURSES.map(courseCard).join("")}</div>` : "") +
        sec("lecture", 8) + sec("analysis", 8);
    } else {
      body = `<div class="section-h"><h2>${state.q ? `Поиск: «${esc(state.q)}»` : state.type !== "all" ? TYPES[state.type].many : "Все видео"}</h2><span class="label">${list.length} ${plural(list.length, "видео", "видео", "видео")}</span></div>${grid(list)}`;
    }

    const intro = plain ? `<section class="intro">
        <div><span class="label">Видеотека о литературном ремесле</span>
          <h1>Как пишут <em>те, кто умеет</em></h1></div>
        <div><p>Интервью с писателями, мастер-классы и разборы текстов в одном месте. Без котиков, новостей и рекомендаций не по теме.</p>
          <div class="stats">
            <div><b>${all().length}</b><span>видео</span></div>
            <div><b>${writers.size}</b><span>${plural(writers.size, "автор", "автора", "авторов")}</span></div>
            <div><b>${COURSES.length}</b><span>${plural(COURSES.length, "курс", "курса", "курсов")}</span></div>
          </div></div>
      </section>` : "";
    return intro + filters + body;
  }

  function watch(id) {
    const v = byId(id);
    if (!v) return notFound();
    const t = TYPES[v.type];
    const others = all().filter(x => x.id !== v.id);
    const related = [
      ...others.filter(x => v.series && x.series === v.series),
      ...others.filter(x => x.writer === v.writer),
      ...others.filter(x => x.type === v.type)
    ].filter((x, i, a) => a.indexOf(x) === i).slice(0, 10);
    document.title = `${v.title} — Чернила`;
    return `<div class="watch">
      <div>
        <div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${esc(v.id)}?rel=0" title="${esc(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
        <span class="label" style="display:block;margin-top:22px">${t ? t.name : ""}${v.lang ? " · " + (LANGS[v.lang] || "") : ""}${v.year ? " · " + v.year : ""}${v.series ? " · " + esc(v.series) : ""}</span>
        <h1 class="w-title" style="margin-top:8px">${esc(v.title)}</h1>
        <div class="w-row">
          <a class="writer" href="#author-${slug(v.writer)}">${esc(v.writer)}</a>
          ${v.by ? `<span style="color:var(--soft)">Собеседник или канал: ${esc(v.by)}</span>` : ""}
          <div class="actions">
            <button class="btn" type="button" data-save="${esc(v.id)}" aria-pressed="${saved.has(v.id)}">${bookmark(saved.has(v.id))}<span>${saved.has(v.id) ? "Отложено" : "Отложить"}</span></button>
            <a class="btn" href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener">Открыть на YouTube ↗</a>
            ${v.custom ? `<button class="btn" type="button" data-remove="${esc(v.id)}">Удалить</button>` : ""}
          </div>
        </div>
        ${v.note ? `<div class="notes"><span class="label">Зачем смотреть</span><p>${esc(v.note)}</p></div>` : ""}
        <p class="hint">Если плеер пишет «Видео недоступно», значит, владелец запретил показ на других сайтах. Кнопка «Открыть на YouTube» сработает всегда.</p>
      </div>
      <aside class="side"><h2>Смотреть дальше</h2><div class="list">
        ${related.map(r => `<a class="mini" href="#watch-${esc(r.id)}">${thumb(r)}<div><h3>${esc(r.title)}</h3><span class="who">${esc(r.writer)}</span></div></a>`).join("")}
      </div></aside>
    </div>`;
  }

  function course(list) {
    const c = COURSES.find(x => x.list === list);
    if (!c) return notFound();
    document.title = `${c.title} — Чернила`;
    const parts = all().filter(v => v.writer === c.writer);
    return `<div class="watch"><div>
        <div class="player"><iframe src="https://www.youtube-nocookie.com/embed/videoseries?list=${esc(c.list)}&rel=0" title="${esc(c.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
        <span class="label" style="display:block;margin-top:22px">Курс${c.lang ? " · " + LANGS[c.lang] : ""}${c.year ? " · " + c.year : ""}</span>
        <h1 class="w-title" style="margin-top:8px">${esc(c.title)}</h1>
        <div class="w-row"><a class="writer" href="#author-${slug(c.writer)}">${esc(c.writer)}</a>
          <div class="actions"><a class="btn" href="https://www.youtube.com/playlist?list=${esc(c.list)}" target="_blank" rel="noopener">Плейлист на YouTube ↗</a></div></div>
        ${c.note ? `<div class="notes"><span class="label">О курсе</span><p>${esc(c.note)}</p></div>` : ""}
        <p class="hint">Плеер проигрывает весь плейлист подряд; переключать занятия можно кнопкой списка в правом верхнем углу плеера.</p>
      </div>
      <aside class="side"><h2>Отдельные занятия</h2><div class="list">
        ${parts.length ? parts.map(r => `<a class="mini" href="#watch-${esc(r.id)}">${thumb(r)}<div><h3>${esc(r.title)}</h3><span class="who">${esc(r.series || r.writer)}</span></div></a>`).join("") : `<p class="hint">Пока все занятия — внутри плейлиста.</p>`}
      </div></aside></div>`;
  }

  function authors() {
    const map = new Map();
    all().forEach(v => map.set(v.writer, (map.get(v.writer) || 0) + 1));
    const list = [...map.entries()].sort((a, b) => a[0].localeCompare(b[0], "ru"));
    document.title = "Авторы — Чернила";
    return `<div class="section-h"><h2>Авторы</h2><span class="label">${list.length} ${plural(list.length, "имя", "имени", "имён")}</span></div>
      <div class="writers">${list.map(([w, n]) => `<a class="wcard" href="#author-${slug(w)}"><span class="mono-av">${esc(initials(w))}</span><span><b>${esc(w)}</b><span>${n} ${plural(n, "видео", "видео", "видео")}</span></span></a>`).join("")}</div>`;
  }

  function author(name) {
    const vids = all().filter(v => v.writer === name);
    const crs = COURSES.filter(c => c.writer === name);
    if (!vids.length && !crs.length) return notFound();
    document.title = `${name} — Чернила`;
    const byType = Object.keys(TYPES).map(k => {
      const items = vids.filter(v => v.type === k);
      return items.length ? `<div class="section-h"><h2>${TYPES[k].many}</h2></div>${grid(items)}` : "";
    }).join("");
    return `<div class="whead"><span class="mono-av">${esc(initials(name))}</span><div><span class="label">Автор</span><h1>${esc(name)}</h1></div></div>
      ${crs.length ? `<div class="section-h"><h2>Курсы</h2></div><div class="courses">${crs.map(courseCard).join("")}</div>` : ""}${byType}`;
  }

  function savedView() {
    document.title = "Отложенное — Чернила";
    const list = all().filter(v => saved.has(v.id));
    return `<div class="section-h"><h2>Отложенное</h2><span class="label">хранится в этом браузере</span></div>` +
      (list.length ? grid(list) : `<div class="empty"><b>Пока пусто</b>Нажмите на закладку на карточке видео, чтобы посмотреть его позже.</div>`);
  }

  function addView() {
    document.title = "Добавить видео — Чернила";
    const json = custom.length ? JSON.stringify(custom.map(({ custom: _, ...v }) => v), null, 2) : "";
    return `<form class="form" id="addForm" novalidate>
      <div><span class="label">Пополнить каталог</span><h1>Добавить видео</h1></div>
      <label for="f-url">Ссылка на YouTube<input id="f-url" name="url" required placeholder="https://www.youtube.com/watch?v=…"></label>
      <div class="preview" id="pv"></div>
      <label for="f-title">Название<input id="f-title" name="title" required placeholder="Например: Набоков о переводе"></label>
      <div class="row">
        <label for="f-writer">Писатель<input id="f-writer" name="writer" required list="writersList" placeholder="Имя и фамилия"></label>
        <label for="f-type">Формат<select id="f-type" name="type">${Object.entries(TYPES).map(([k, t]) => `<option value="${k}">${t.name}</option>`).join("")}</select></label>
      </div>
      <div class="row">
        <label for="f-lang">Язык<select id="f-lang" name="lang"><option value="ru">Русский</option><option value="en">Английский</option></select></label>
        <label for="f-year">Год записи<input id="f-year" name="year" inputmode="numeric" placeholder="необязательно"></label>
      </div>
      <label for="f-note">Зачем смотреть<textarea id="f-note" name="note" rows="2" placeholder="Одна-две фразы"></textarea></label>
      <datalist id="writersList">${[...new Set(all().map(v => v.writer))].map(w => `<option value="${esc(w)}">`).join("")}</datalist>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn primary" type="submit">Добавить в каталог</button><span class="msg" id="msg" role="status"></span></div>
      <p class="hint" style="margin:0">Добавленные видео видны только в этом браузере. Чтобы они появились у всех, скопируйте код ниже в <code>catalog.js</code>.</p>
      ${json ? `<div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="label">Ваши добавления · ${custom.length}</span><button class="btn" type="button" id="copyJson">Скопировать код</button></div><pre class="export" id="jsonOut">${esc(json)}</pre></div>` : ""}
    </form>`;
  }

  const notFound = () => `<div class="empty"><b>Такой страницы нет</b><a href="#">Вернуться к видео</a></div>`;

  function parseYouTube(s) {
    s = (s || "").trim();
    if (/^[\w-]{11}$/.test(s)) return s;
    try {
      const u = new URL(s);
      if (/youtu\.be$/.test(u.hostname)) return u.pathname.slice(1, 12);
      if (u.searchParams.get("v")) return u.searchParams.get("v").slice(0, 11);
      const m = u.pathname.match(/\/(?:embed|shorts|live|v)\/([\w-]{11})/);
      return m ? m[1] : null;
    } catch { return null; }
  }

  /* ── маршрутизация ── */
  const view = document.getElementById("view");
  function render() {
    const h = decodeURIComponent(location.hash.slice(1));
    let html, nav = "home";
    document.title = "Чернила";
    if (h.startsWith("watch-")) html = watch(h.slice(6));
    else if (h.startsWith("course-")) html = course(h.slice(7));
    else if (h.startsWith("author-")) { html = author(h.slice(7)); nav = "authors"; }
    else if (h === "authors") { html = authors(); nav = "authors"; }
    else if (h === "saved") { html = savedView(); nav = "saved"; }
    else if (h === "add") { html = addView(); nav = "add"; }
    else html = home();
    view.innerHTML = html;
    document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    document.getElementById("savedCount").textContent = saved.size || "";
    if (nav === "add") bindForm();
  }
  window.addEventListener("hashchange", () => { render(); window.scrollTo({ top: 0 }); });

  /* ── события ── */
  const q = document.getElementById("q");
  let t;
  q.addEventListener("input", () => {
    clearTimeout(t);
    t = setTimeout(() => {
      state.q = q.value;
      if (location.hash && location.hash !== "#") location.hash = ""; else render();
    }, 160);
  });

  document.addEventListener("click", e => {
    const s = e.target.closest("[data-save]");
    if (s) {
      e.preventDefault(); e.stopPropagation();
      const id = s.dataset.save;
      saved.has(id) ? saved.delete(id) : saved.add(id);
      store.set("saved", [...saved]);
      const y = window.scrollY; render(); window.scrollTo({ top: y });
      return;
    }
    const f = e.target.closest("[data-f]");
    if (f) { state[f.dataset.f] = f.dataset.v; render(); return; }
    const p = e.target.closest("[data-pick]");
    if (p) { e.preventDefault(); state.type = p.dataset.pick; render(); window.scrollTo({ top: 0 }); return; }
    if (e.target.closest("[data-reset]")) { Object.assign(state, { type: "all", lang: "all", q: "" }); q.value = ""; render(); return; }
    const r = e.target.closest("[data-remove]");
    if (r) {
      custom = custom.filter(v => v.id !== r.dataset.remove); store.set("custom", custom);
      saved.delete(r.dataset.remove); store.set("saved", [...saved]);
      location.hash = ""; return;
    }
    if (e.target.closest(".logo")) { Object.assign(state, { type: "all", lang: "all", q: "" }); q.value = ""; if (!location.hash || location.hash === "#") { render(); window.scrollTo({ top: 0 }); } }
  });

  function bindForm() {
    const form = document.getElementById("addForm"), msg = document.getElementById("msg"), pv = document.getElementById("pv");
    const url = form.elements.url;
    url.addEventListener("input", () => {
      const id = parseYouTube(url.value);
      pv.classList.toggle("on", !!id);
      pv.innerHTML = id ? `${thumb({ id, writer: "" })}<span class="hint" style="margin:0">Ролик найден: <code>${esc(id)}</code></span>` : "";
    });
    form.addEventListener("submit", e => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(form));
      const id = parseYouTube(d.url);
      msg.className = "msg err";
      if (!id) { msg.textContent = "Не получилось узнать ролик по ссылке. Скопируйте адрес из строки браузера на странице видео."; return; }
      if (byId(id)) { msg.textContent = "Это видео уже есть в каталоге."; return; }
      if (!d.title.trim() || !d.writer.trim()) { msg.textContent = "Заполните название и имя писателя."; return; }
      const v = { id, type: d.type, writer: d.writer.trim(), lang: d.lang, title: d.title.trim() };
      const y = parseInt(d.year, 10); if (y > 1800 && y < 2100) v.year = y;
      if (d.note.trim()) v.note = d.note.trim();
      custom.unshift(v); store.set("custom", custom);
      render();
      const m = document.getElementById("msg"); m.className = "msg ok"; m.innerHTML = `Добавлено. <a href="#watch-${esc(id)}">Открыть видео</a>`;
    });
    const copy = document.getElementById("copyJson");
    if (copy) copy.addEventListener("click", async () => {
      const text = document.getElementById("jsonOut").textContent;
      try { await navigator.clipboard.writeText(text); copy.textContent = "Скопировано"; }
      catch { const r = document.createRange(); r.selectNodeContents(document.getElementById("jsonOut")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copy.textContent = "Выделено — нажмите Ctrl+C"; }
    });
  }

  render();
})();
</script>
</body>
</html>
